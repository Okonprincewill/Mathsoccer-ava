function categorizeButtonsByDirection(variableLocation) {
    if (!variableLocation || typeof variableLocation.x !== 'number') {
        console.error('BAD ARG at caller:', variableLocation);
        console.trace();
    }
    
  const seedsByDirection = {
    'up': [], 'down': [], 'left': [], 'right': [],
    'up-left': [], 'up-right': [], 'down-left': [], 'down-right': []
  };

  buttons.forEach(button => {
   if (button !== variableLocation) {
        const dx = button.x - variableLocation.x-3;
  const dy = button.y - variableLocation.y-3;
       
       //console.log('dx:', dx, 'dy:', dy);
       
      if (dx === 0 && dy < 0) seedsByDirection['up'].push(button);
      else if (dx === 0 && dy > 0) seedsByDirection['down'].push(button);
      else if (dy === 0 && dx < 0) seedsByDirection['left'].push(button);
      else if (dy === 0 && dx > 0) seedsByDirection['right'].push(button);
      else if (Math.abs(dx) === Math.abs(dy)) {
        if (dx > 0 && dy > 0) seedsByDirection['down-right'].push(button);
        else if (dx < 0 && dy > 0) seedsByDirection['down-left'].push(button);
        else if (dx > 0 && dy < 0) seedsByDirection['up-right'].push(button);
        else if (dx < 0 && dy < 0) seedsByDirection['up-left'].push(button);
      }
    }
  });
    

  // Sort buttons in each direction by Manhattan distance
  Object.keys(seedsByDirection).forEach(direction => {
    seedsByDirection[direction].sort((a, b) => {
      const distanceA = Math.abs(a.x - variableLocation.x) + Math.abs(a.y - variableLocation.y);
      const distanceB = Math.abs(b.x - variableLocation.x) + Math.abs(b.y - variableLocation.y);
      return distanceA - distanceB;
    });
  });

  return seedsByDirection;
}

    const thirdButton = buttonsInLine[2];

    if (secondButton.col !== ownColor) return false;

function exposeCollinearThreat(cell) {
    if (cell === compAns || cell.occupancy==="yes") return;
    const cellDir = categorizeButtonsByDirection(cell);
    const allDirs = ['right', 'left', 'up', 'down', 'up-left', 'up-right', 'down-left', 'down-right'];
    
    for (let d of allDirs) {
        const buttonsInLine = cellDir && cellDir[d];
        if (!buttonsInLine || buttonsInLine.length < 2) continue;
        
        // buttonsInLine[0] is closest to cell
        const closest = buttonsInLine[0];
        const second = buttonsInLine[1];
        
        // Own button must be closest, opponent behind it
        if (closest.col === ownColor && second.col === opponentColor) {
            if (isLinkedToCompAns(closest)) {
                exemptButtons.add(closest);
                logExemptedButton(closest.id, `moving exposes ${cell.id}`);
                return;
            }
        }
    }
}

function areCollinear(ownBtn, oppBtn, compAns, whiteSquare) {
    const ownX = ownBtn.x;
    const ownY = ownBtn.y;
    const oppX = oppBtn.x;
    const oppY = oppBtn.y;
    const compX = compAns.x + 3;
    const compY = compAns.y + 3;
    const whiteX = whiteSquare.x + 3;
    const whiteY = whiteSquare.y + 3;
    
    if (ownX === oppX && ownX === compX && ownX === whiteX) return true;
    if (ownY === oppY && ownY === compY && ownY === whiteY) return true;
    if (Math.abs(ownX - oppX) === Math.abs(ownY - oppY) &&
        Math.abs(ownX - compX) === Math.abs(ownY - compY) &&
        Math.abs(ownX - whiteX) === Math.abs(ownY - whiteY)) {
        return true;
    }
    return false;
}

function canReach(button, target) {
    const dirResult = categorizeButtonsByDirection(target);
    const allDirs = ['right', 'left', 'up', 'down', 'up-left', 'down-left', 'up-right', 'down-right'];
    for (let d of allDirs) {
        if (dirResult && dirResult[d] && dirResult[d][0] === button) {
            return true;
        }
    }
    return false;
}

function isCriticalDefender(button) {
    const goalMouth = positions[3];
    const goalDir = categorizeButtonsByDirection(goalMouth);
    const goalBlocker = goalDir && goalDir[dir] && goalDir[dir][0];
    if (goalBlocker && goalBlocker === button) return true;
    
    const whiteBlockerPositions = [positions[0], positions[1]];
for (let white of whiteBlockerPositions) {
    if (!white) continue;
    const blocker = buttons.find(b => 
        b.x === white.x + 3 && b.y === white.y + 3 && b.col === ownColor
    );
    const yellowIndex = (white === whiteBlockerPositions[0]) ? 4 : 5;
    const yellow = positions[yellowIndex];
    if (yellow) {
        const oppOnYellow = buttons.find(b => 
            b.x === yellow.x + 3 && b.y === yellow.y + 3 && b.col === opponentColor
        );
        if (oppOnYellow && blocker === button) return true;  // ✅ Fixed
    }
}
    
    for (let yellow of attackedYellow) {
        if (!yellow) continue;
        if (button.x === yellow.x + 3 && button.y === yellow.y + 3) {
            const whiteIndex = (yellow === attackedYellow[0]) ? 0 : 1;
            const white = positions[whiteIndex];
            if (white) {
                const oppOnWhite = buttons.find(b => 
                    b.x === white.x + 3 && b.y === white.y + 3 && b.col === opponentColor
                );
                if (oppOnWhite) return true;
            }
        }
    }
    
    return false;
}

function isMultiAttacker(button) {
    let attacksWhite = false;
    let attacksYellow = false;
    let attacksCentral = false;
    
    for (let white of whiteSquares) {
        if (canReach(button, white)) { attacksWhite = true; break; }
    }
    for (let yellow of yellowSquares) {
        if (canReach(button, yellow)) { attacksYellow = true; break; }
    }
    for (let central of centralCells) {
        if (canReach(button, central)) { attacksCentral = true; break; }
    }
    return (attacksWhite && attacksYellow) || 
           (attacksWhite && attacksCentral) || 
           (attacksYellow && attacksCentral);
}

function getFellowMultiAttackers(button) {
    const fellows = [];
    for (let otherBtn of buttons) {       
        if (otherBtn.col !== ownColor) continue;
        if (otherBtn === button) continue;
        if (isMultiAttacker(otherBtn)) {
            const b1White = whiteSquares.some(w => canReach(button, w));
            const b2White = whiteSquares.some(w => canReach(otherBtn, w));
            const b1Yellow = yellowSquares.some(y => canReach(button, y));
            const b2Yellow = yellowSquares.some(y => canReach(otherBtn, y));
            const b1Central = centralCells.some(c => canReach(button, c));
            const b2Central = centralCells.some(c => canReach(otherBtn, c));
            if ((b1White && b2White) || (b1Yellow && b2Yellow) || (b1Central && b2Central)) {            
                fellows.push(otherBtn);
            }
        }
    }
    return fellows;
}

function getAttackedYellow(button) {
    for (let yellow of yellowSquares) {
        if (canReach(button, yellow)) {
            return yellow;
        }
    }
    return null;
}

    const fellowMultiAttackers = getFellowMultiAttackers(button);
    for (let otherBtn of buttons) {
        if (otherBtn === button) continue;
        if (otherBtn.col !== ownColor) continue;
        if (fellowMultiAttackers.includes(otherBtn)) continue;
        if (isCriticalDefender(otherBtn)) continue;
        if (canReach(otherBtn, yellowTarget)) {

        }
    }
    return false;
}

function isOnBlockedOpponentYellow(button, attacked, buttons, opponentColor) {

            b.x === attacked[0].x + 3 &&

    }

    if (button.x === attacked[5].x + 3 && button.y === attacked[5].y + 3) {
        const oppOnGate = buttons.find(b =>
            b.x === attacked[1].x + 3 &&
            b.y === attacked[1].y + 3 &&
            b.col === opponentColor
        );
        return oppOnGate ? { yellow: attacked[5], gate: attacked[1] } : null;
    }

    return null;
}

// ===========================================
function computeSafeNumbersCount() {
    // Save the current state so strictMove()'s side effects
    // don't leak into the caller.
    const savedLogData = currentLogData;
    currentLogData = {
        linkedNumbers: [],
        exemptedNumbers: [],
        exemptedButtons: [],
        choiceButton: null,
        choiceNumber: null
    };

    let count = 0;
    try {
        const safe = strictMove();
        count = (safe && safe.length) ? safe.length : 0;
    } catch (e) {
        console.warn("computeSafeNumbersCount failed:", e);
        count = 0;
    }

    // Restore the log data we swapped out.
    currentLogData = savedLogData;
    return count;
}

// ============================================================
// IDENTIFY THREAT LINKS — minimal
//
// Set 1 (safe cells)  : strictMove() output
// Set 2 (threat cells): empty white/yellow cells in opponent
//                       territory with no defender on the queen
//                       line to the goal
//
// Link : a safe cell links to a threat cell if they sit on the
//        same queen line and no button blocks the segment between.
//
// Universal — mover color and target goal resolved by color.
// ============================================================

function identifyThreatLinks() {
    if (!answer || !buttons) return { safeCells: [], threatAreas: [] };

    const gameState = getGameState();
    const { attacked, isRedTurn, ownColor, opponentColor, dir } = gameState;

    const goalCell = gameState.attacked[3];
    if (!goalCell) return { safeCells: [], threatAreas: [] };

    const allDirections = ['right', 'left', 'up', 'down', 'up-left', 'down-left', 'up-right', 'down-right'];

    function directionFromTo(from, to) {
        const dx = to.x - from.x;
        const dy = to.y - from.y;

        if (dx === 0 && dy === 0) return null;
        if (dx === 0 && dy < 0) return 'up';
        if (dx === 0 && dy > 0) return 'down';
        if (dy === 0 && dx < 0) return 'left';
        if (dy === 0 && dx > 0) return 'right';

        if (Math.abs(dx) === Math.abs(dy)) {
            if (dx > 0 && dy > 0) return 'down-right';
            if (dx < 0 && dy > 0) return 'down-left';
            if (dx > 0 && dy < 0) return 'up-right';
            if (dx < 0 && dy < 0) return 'up-left';
        }

        return null;
    }

    // =========================================
    // STEP 1: Find threat cells
    //         priority first — attacked[2] and attacked[6]
    //         then everything else
    // =========================================
    const threatCells = [];
    const midY = (answer[0].y + answer[36].y) / 2;
    const goalIsTop = (goalCell.y < midY);
    
    let c1 = 0, c2 = 0, c3 = 0, c4 = 0, c5 = 0, c6 = 0;

    for (let cell of answer) {
        if (cell.occupancy !== 'no') continue;
        c1++;
        if (cell.col !== 'white' && cell.col !== 'yellow') continue;
        c2++;
        if (cell === goalCell) continue;
        c3++;

        const cellIsTop = (cell.y < midY);
        if (goalIsTop !== cellIsTop) continue;
        c4++;

        const dirToGoal = directionFromTo(cell, goalCell);
        if (!dirToGoal) continue;
        c5++;

        const cellDir = categorizeButtonsByDirection(cell);
        const firstBtn = cellDir && cellDir[dirToGoal] && cellDir[dirToGoal][0];
        if (firstBtn && firstBtn.col === opponentColor) continue;
        c6++;

        // ── priority boost: if this cell is attacked[2] or attacked[6], push it to the front ──
        const isPriority = (cell === attacked[2] || cell === attacked[6]);

        if (isPriority) {
            threatCells.unshift(cell);
        } else {
            threatCells.push(cell);
        }
    }
    
    
console.log('[itl] Step 1 filter counts:', { c1, c2, c3, c4, c5, c6 });
console.log('[itl] goalCell.id:', goalCell.id, 'goalIsTop:', goalIsTop, 'midY:', midY);

    // =========================================
    // STEP 2: creative cells linked to threat cells
    // =========================================
    const creativeCells = [];

    for (let cell of answer) {
        if (cell.occupancy !== 'no') continue;
        if (cell === answer[0] || cell === answer[36]) continue;

        const linksTo = [];

        for (let threat of threatCells) {
            const linkDir = directionFromTo(cell, threat);
            if (!linkDir) continue;

            const cellDir2 = categorizeButtonsByDirection(cell);
            const firstBtnOnLine = cellDir2 && cellDir2[linkDir] && cellDir2[linkDir][0];

            if (firstBtnOnLine) {
                const dBtn    = Math.abs(firstBtnOnLine.x - (cell.x + 3)) +
                                Math.abs(firstBtnOnLine.y - (cell.y + 3));
                const dThreat = Math.abs(threat.x - cell.x) +
                                Math.abs(threat.y - cell.y);
                if (dBtn < dThreat) continue;
            }

            linksTo.push(threat.id);
        }

        if (linksTo.length > 0) {
            creativeCells.push({
                cellId: cell.id,
                col: cell.col,
                x: cell.x,
                y: cell.y,
                linksTo: linksTo
            });
        }
    }

    // =========================================
    // STEP 3: safety filter
    // =========================================
    let safeCellIds = new Set();
    let safeList = [];
    try {
        safeList = strictMove() || [];
        safeCellIds = new Set(safeList.map(c => c.id));
    } catch (e) {
        console.warn('identifyThreatLinks: strictMove failed', e);
    }

    if (safeList.length === 0) return null;

    const safeCreativeCells = creativeCells.filter(c => safeCellIds.has(c.cellId));

    return {
        safeCells: safeCreativeCells,
        threatAreas: threatCells.map(t => ({ cellId: t.id }))
    };
}

function categorizeCellsByDirection(variableLocation) {
     const seedsByDirection = {
    'up': [], 'down': [], 'left': [], 'right': [],
    'up-left': [], 'up-right': [], 'down-left': [], 'down-right': []
  };

  // Step 1: find closest button in each direction
  buttons.forEach(button => {
    if (button !== variableLocation) {
      const dx = button.x - variableLocation.x - 3;
      const dy = button.y - variableLocation.y - 3;

      let matchedDir = null;

      if (dx === 0 && dy < 0) matchedDir = 'up';
      else if (dx === 0 && dy > 0) matchedDir = 'down';
      else if (dy === 0 && dx < 0) matchedDir = 'left';
      else if (dy === 0 && dx > 0) matchedDir = 'right';
      else if (Math.abs(dx) === Math.abs(dy)) {
        if (dx > 0 && dy > 0) matchedDir = 'down-right';
        else if (dx < 0 && dy > 0) matchedDir = 'down-left';
        else if (dx > 0 && dy < 0) matchedDir = 'up-right';
        else if (dx < 0 && dy < 0) matchedDir = 'up-left';
      }

      if (matchedDir) seedsByDirection[matchedDir].push(button);
    }
  });

  // Step 2: sort each direction's buttons by Manhattan distance (closest first)
  Object.keys(seedsByDirection).forEach(direction => {
    seedsByDirection[direction].sort((a, b) => {
      const distanceA = Math.abs(a.x - variableLocation.x) + Math.abs(a.y - variableLocation.y);
      const distanceB = Math.abs(b.x - variableLocation.x) + Math.abs(b.y - variableLocation.y);
      return distanceA - distanceB;
    });
  });

  // Step 3: build the cellsBetween map
  const cellsByDirection = {
    'up': [], 'down': [], 'left': [], 'right': [],
    'up-left': [], 'up-right': [], 'down-left': [], 'down-right': []
  };

  Object.keys(seedsByDirection).forEach(direction => {
    const closestButton = seedsByDirection[direction][0];

    // Gather all cells on this queen line from variableLocation,
    // in order of increasing distance (closest first).
    const allCellsOnLine = answer.filter(cell => {
      const dx = cell.x - variableLocation.x;
      const dy = cell.y - variableLocation.y;

      if (dx === 0 && dy === 0) return false;

      if (direction === 'up')         return (dx === 0 && dy < 0);
      if (direction === 'down')       return (dx === 0 && dy > 0);
      if (direction === 'left')       return (dy === 0 && dx < 0);
      if (direction === 'right')      return (dy === 0 && dx > 0);
      if (direction === 'up-left')    return (dx < 0 && dy < 0 && Math.abs(dx) === Math.abs(dy));
      if (direction === 'up-right')   return (dx > 0 && dy < 0 && Math.abs(dx) === Math.abs(dy));
      if (direction === 'down-left')  return (dx < 0 && dy > 0 && Math.abs(dx) === Math.abs(dy));
      if (direction === 'down-right') return (dx > 0 && dy > 0 && Math.abs(dx) === Math.abs(dy));
      return false;
    });

    allCellsOnLine.sort((a, b) => {
      const dA = Math.abs(a.x - variableLocation.x) + Math.abs(a.y - variableLocation.y);
      const dB = Math.abs(b.x - variableLocation.x) + Math.abs(b.y - variableLocation.y);
      return dA - dB;
    });

    if (allCellsOnLine.length === 0) return;

    // Rule 3: if nearest cell is occupied → direction is empty
    if (allCellsOnLine[0].occupancy !== 'no') return;

    // Rule 1: only unoccupied cells
    const unoccupiedOnLine = allCellsOnLine.filter(c => c.occupancy === 'no');

    if (closestButton) {
      // Rule: bounded by the closest button — only cells before it
      const buttonDist = Math.abs(closestButton.x - variableLocation.x - 3) +
                         Math.abs(closestButton.y - variableLocation.y - 3);

      cellsByDirection[direction] = unoccupiedOnLine.filter(cell => {
        const cellDist = Math.abs(cell.x - variableLocation.x) +
                         Math.abs(cell.y - variableLocation.y);
        return cellDist < buttonDist;
      });
    } else {
      // Rule 2: no button in this direction → include all unoccupied cells
      cellsByDirection[direction] = unoccupiedOnLine;
    }
  });

  return cellsByDirection;
}

function blockMove() {
    console.log("Move check:", "blockMove");
    def = 0;
    exDef = 0;
    advAns = 1;
    let foundButton = null;

    const gameState = getGameState();
    const { positions, ownColor, opponentColor, isRedTurn } = gameState;

    const ownGoal = positions[3];

    const oppositeDir = {
        'up': 'down',
        'down': 'up',
        'left': 'right',
        'right': 'left',
        'up-left': 'down-right',
        'up-right': 'down-left',
        'down-left': 'up-right',
        'down-right': 'up-left'
    };

    // categorizeCellsByDirection gives us, per direction,
    // the unoccupied cells between ownGoal and the closest button.
    const cellsByDir = categorizeCellsByDirection(ownGoal);

    // categorizeButtonsByDirection gives us the attacker detection
    const goalDir = categorizeButtonsByDirection(ownGoal);

    // Shuffle directions so the choice is not predictable
    const shuffledDirs = shuffleArray(Object.keys(cellsByDir));

    for (let d of shuffledDirs) {

        // Opponent attacker in this direction from our goal?
        const firstButton = goalDir && goalDir[d] && goalDir[d][0];
        if (!firstButton || firstButton.col !== opponentColor) continue;

        // Cells between ownGoal and that attacker, same line, unoccupied
        const candidates = cellsByDir[d];

        for (let cell of candidates) {

            // Opposite direction from cell must be clear
            const cellDir = categorizeButtonsByDirection(cell);
            if (cellDir[oppositeDir[d]] && cellDir[oppositeDir[d]].length > 0) continue;

            compAns = cell;
            if (
                ((compAns.id >= problemFactor && compAns.id / problemFactor < 10 && compAns.id % problemFactor == 0) ||
                 (compAns.id < problemFactor && problemFactor % compAns.id == 0)) &&
                compAns.occupancy == "no" &&
                ((isRedTurn && compAns.col !== 'red') || (!isRedTurn && compAns.col !== 'blue'))
            ) {
                if (compAns.col != 'white' || (compAns.col == 'white' && compAns.side === opponentColor)) {
                    foundButton = searchDirections();
                } else if (compAns.col == 'white' && compAns.side === ownColor) {
                    foundButton = whiteMove();
                }

                if (foundButton) {
                    compBut = foundButton;
                    console.log("Choice button:", compBut.id);
                    console.log("Choice number:", compAns.id);
                    makeMove();
                    return true;
                }
            }
        }
    }

    return false;
}

    for (let cell of answer) {

        // 2. Only white or yellow cells
        if (cell.col !== 'white' && cell.col !== 'yellow') continue;

        // Candidate must be beyond the reference row — half chance zone
        if (dir === "up" && !(cell.y > referenceY)) continue;
        if (dir === "down" && !(cell.y < referenceY)) continue;

        // 3. Reachable cells from the candidate, per direction
        const cellsByDir = categorizeCellsByDirection(cell);

        // 4. Find the direction where the goal appears in the candidate's reachable cells
        let matchedDir = null;

            if (arr.includes(goalCell)) {
                matchedDir = d;
                break;
            }

        if (!matchedDir) continue;

        // 5. Confirm no button along that direction from the candidate
        const cellDir = categorizeButtonsByDirection(cell);
        if (cellDir[matchedDir] && cellDir[matchedDir].length > 0) continue;

        chanceCells.push(cell);
    }

    const shuffled = shuffleArray(chanceCells);

    for (let cell of shuffled) {
        compAns = cell;
        if (
            ((compAns.id >= problemFactor && compAns.id / problemFactor < 10 && compAns.id % problemFactor == 0) ||

        }
    }

// Shuffle function (Fisher-Yates algorithm)
function shuffleArray(arr) {
  let newArr = [...arr]; // Create a copy to avoid modifying the original
  for (let i = newArr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArr[i], newArr[j]] = [newArr[j], newArr[i]]; // Swap elements
  }
  return newArr;
}

ctx = savedCtx;

const savedBtnX   = targetButton.x;
const savedBtnY   = targetButton.y;

btnSprite.width  = 45 * dpr;

manButtonMove(0, 0);
ctx = savedCtx2;

    targetButton.tagBox = savedTagBox;
    targetButton.x      = savedBtnX;
    targetButton.y      = savedBtnY;

    // =============================================
// 3. Offscreen frame buffer
// =============================================
const offCanvas = document.createElement('canvas');
offCanvas.width  = 360 * dpr;
offCanvas.height = 800 * dpr;
const offCtx = offCanvas.getContext('2d');

    let lastFrameTime = 0;
let lastMoveTime  = 0;
let startTime     = 0;

    function animate(timestamp) {
        if (gamePaused) {
            animationFrameId = requestAnimationFrame(animate);
            return;
        }

        if (!lastMoveTime) lastMoveTime = timestamp;
        if (timestamp - lastFrameTime < FRAME_MS) {
            animationFrameId = requestAnimationFrame(animate);
            return;
        }

        const deltaTime = Math.min(timestamp - lastMoveTime, 60);
        lastMoveTime    = timestamp;
        lastFrameTime   = timestamp;

        const dx = targetX - targetButton.x;
        const dy = targetY - targetButton.y;

        // ---------- Arrived ----------
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
            targetButton.x = targetX;
            targetButton.y = targetY;

            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;

            resetMainTransform();
            ctx.clearRect(0, 0, 360, 800);
            renderAnswer();
            renderButtons();
            renderStats();
            statDraw(va, vb, vc, vd, ve, vf, vg, vh);
            postAnim();
            return;
        }

        const moveX = Math.sign(dx) * Math.min(speed * (deltaTime / 1000), Math.abs(dx));
        const moveY = Math.sign(dy) * Math.min(speed * (deltaTime / 1000), Math.abs(dy));

        targetButton.x += moveX;
        targetButton.y += moveY;

        // ---------- Compose ----------
const saveInner = ctx;
ctx = offCtx;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
ctx.clearRect(0, 0, 360, 800);
ctx.drawImage(baseCanvas, 0, 0, 360, 800);
ctx.drawImage(btnSprite, targetButton.x, targetButton.y, 45, 45);
ctx = saveInner;

// ---------- Blit to main canvas ----------
resetMainTransform();
ctx.clearRect(0, 0, 360, 800);
ctx.drawImage(offCanvas, 0, 0, 360, 800);
        
        animationFrameId = requestAnimationFrame(animate);
    }

    lastMoveTime = performance.now();
    animationFrameId = requestAnimationFrame(animate);
}

function manButtonMove(a, b) {
    const cx = a + 22.5;
    const cy = b + 22.5;
    const r = 18;
    const colors = getButtonColors(targetButton.col);
    
    ctx.save();
    
    // MAIN BUTTON WITH 3D GRADIENT
    const bodyGrad = ctx.createRadialGradient(cx - 4, cy - 6, 2, cx, cy, r + 1);
    bodyGrad.addColorStop(0, colors.lightColor);
    bodyGrad.addColorStop(0.5, targetButton.col);  // Changed from circles.col to targetButton.col
    bodyGrad.addColorStop(0.7, colors.darkColor);
    
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    
    // Grey arc
    ctx.beginPath();
    ctx.arc(cx, cy, 12, Math.PI / 2, Math.PI * 5 / 4);
    ctx.strokeStyle = 'grey';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Specular highlight
    const highlightGrad = ctx.createRadialGradient(cx - 6, cy - 8, 1, cx - 3, cy - 5, r * 0.5);
    highlightGrad.addColorStop(0, 'rgba(255,255,255,0.5)');
    highlightGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = highlightGrad;
    
    // Outline
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'black';
    ctx.stroke();
    
    // Button label
    ctx.font = 'bold 18px fantasy, papyrus';
    ctx.fillStyle = '#CFC';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(targetButton.id, cx, cy + 1);  // Changed from circles.id to targetButton.id    
    ctx.restore();

    // ✅ Draw tag for the moving button at its new position
    const origX = targetButton.x;
    const origY = targetButton.y;
    targetButton.x = a;
    targetButton.y = b;
    drawButtonTag(targetButton);
    targetButton.x = origX;
    targetButton.y = origY;
}

function calculatePoints(isComputer) {

    const opponentColor = (side === 0) ? 'blue' : 'red';
    
    // Determine who moved

    }
    
    // === FULL CHANCE (5 points) ===
    else if (
        (!isComputer && (targetAnswer === answer[2] || targetAnswer === answer[4] || targetAnswer === answer[3])) ||
        (isComputer && (targetAnswer === answer[32] || targetAnswer === answer[34] || targetAnswer === answer[33]))
    ) {
        points = 5;
    }
    
    // === HALF CHANCE (3 points) ===
    else if (
        (!isComputer && (
            (targetAnswer === answer[10] && answer[4].occupancy === 'no') ||
            (targetAnswer === answer[6] && answer[2].occupancy === 'no')
        )) ||
        (isComputer && (
            (targetAnswer === answer[26] && answer[32].occupancy === 'no') ||
            (targetAnswer === answer[30] && answer[34].occupancy === 'no')
        ))
    ) {
        points = 3;
    }
    
    // === MID HALF (3 points) ===
    else if (
        (!isComputer && targetAnswer.x === answer[0].x && categorizeButtonsByDirection(targetAnswer)["up"].length === 0 && targetAnswer.id !== answer[0].id && targetAnswer.id !== answer[3].id) ||
        (isComputer && targetAnswer.x === answer[36].x && categorizeButtonsByDirection(targetAnswer)["down"].length === 0 && targetAnswer.id !== answer[36].id && targetAnswer.id !== answer[33].id)
    ) {
        points = 3;
    }
    
    // === WING BLOCK (2 points) ===
    else if (
        (!isComputer && (
            (targetAnswer === answer[32] && answer[26].occupancy === 'yes' && isOpponentOnYellow(answer[26])) ||
            (targetAnswer === answer[34] && answer[30].occupancy === 'yes' && isOpponentOnYellow(answer[30]))
        )) ||
        (isComputer && (
            (targetAnswer === answer[4] && answer[10].occupancy === 'yes' && isOpponentOnYellow(answer[10])) ||
            (targetAnswer === answer[2] && answer[6].occupancy === 'yes' && isOpponentOnYellow(answer[6]))
        ))
    ) {
        points = 2;
    }
    
    // === MID BLOCK (2 points) ===
    else if (
        (!isComputer && targetAnswer.x === answer[36].x && categorizeButtonsByDirection(targetAnswer)["down"].length === 0 && categorizeButtonsByDirection(targetAnswer)["up"][0].col === opponentColor) ||
        (isComputer && targetAnswer.x === answer[0].x && categorizeButtonsByDirection(targetAnswer)["up"].length === 0 && categorizeButtonsByDirection(targetAnswer)["down"][0].col === playerColor)
    ) {
        points = 2;
    }
    
    // === OTHER (1 point) ===
    else {
        points = 1;
    }
    
    // Add points to the correct team
    if (targetTeam === 'red') {
        redPoints += points;
    } else {
        bluePoints += points;
    }
}

// ===========================================
// GENERATE LINKS FOR TEAM (WITH WHITE SECTION RULE)
// ===========================================
function generateLinksForTeam(team) {
    const links = { 'W': [], 'X': [], 'Y': [], 'Z': [] };
    
    // Find white button once
    const whiteButton = findWhiteButtonInSection(team);
    const hasWhiteButton = whiteButton !== null;
    
    curAns.forEach(number => {
        const targetCell = answer.find(cell => cell.id == number);
        if (!targetCell) return;
        
        const isWhiteCell = (targetCell.col === 'white' && targetCell.side === team);
        
        const directions = ['right', 'left', 'up', 'down', 'up-left', 'down-left', 'up-right', 'down-right'];
        
        directions.forEach(dir => {
            const dirResult = categorizeButtonsByDirection(targetCell);
            if (dirResult && dirResult[dir] && dirResult[dir][0]) {
                const btn = dirResult[dir][0];
                if (btn && btn.col === team) {
                    // White section rule
                    if (isWhiteCell && hasWhiteButton && whiteButton !== btn) {
                        return; // Skip - only white button can enter occupied white
                    }
                    
                    if (!links[btn.id].includes(number)) { 
                        links[btn.id].push(number);
                    }
                }
            }
        });
    });
    
    Object.keys(links).forEach(key => {
        links[key].sort((a, b) => a - b);
    });
    
    return links;
}

// ===========================================
function findLinkedNumbersForButton(button) {
    selectedButtonLinks = []; 
    
    const isRedTurn = (r % 2 !== 0);
    const currentTeam = isRedTurn ? 'red' : 'blue';
    
    // Find if there's already a button in current team's white section
    const myWhiteCells = answer.filter(cell => cell.col === 'white' && cell.side === currentTeam);

        const btn = buttons.find(b => 
            b.col === currentTeam && 
            b.x === cell.x + 3 && 
            b.y === cell.y + 3
        );
        if (btn) {
            whiteButton = btn;
            break;
        }
    }
     
    const hasWhiteButton = whiteButton !== null;
    const isThisWhiteButton = (whiteButton && 
                              whiteButton.x === button.x && 
                              whiteButton.y === button.y);
    
    // Check each number in curAns
    curAns.forEach(number => {
    const opponentColor = (currentTeam === 'red') ? 'blue' : 'red';

    let targetCell;
    if (number == 1) {
        targetCell = answer.find(c => c.id == 1 && c.col === opponentColor);
    } else {
        targetCell = answer.find(c => c.id == number);
    }

    if (!targetCell) return;

          // WHITE SECTION RULE: Only my white button can enter my white if occupied
        if (targetCell.col === 'white' && targetCell.side === currentTeam) {
            if (hasWhiteButton && !isThisWhiteButton) {
                return; // Cannot enter occupied white
            }
        }
        
        // Check if this button can reach this number
        const directions = ['right', 'left', 'up', 'down', 'up-left', 'down-left', 'up-right', 'down-right']; 
         
        directions.forEach(dir => {
            const dirResult = categorizeButtonsByDirection(targetCell);

                const btn = dirResult[dir][0];
                if (btn && btn.x === button.x && btn.y === button.y) {
                    if (!selectedButtonLinks.includes(number)) {

        });
    });
    
    // Sort for consistency

// FAIR PAIRING — HELPERS
// ===========================================
const ALL_TEAMS = [
    'red-0','red-1','red-2','red-3',
    'blue-0','blue-1','blue-2','blue-3'
];

function teamId(color, diff) {
    return color + '-' + diff;
}

// ---------- LOAD ----------
function loadPairingState() {
    let l4g = [];
    let l4o = {};
    let ps  = {};

    try { l4g = JSON.parse(localStorage.getItem(PAIRING_L4G_KEY))  || []; } catch (e) {}
    try { l4o = JSON.parse(localStorage.getItem(PAIRING_L4O_KEY))  || {}; } catch (e) {}
    try { ps  = JSON.parse(localStorage.getItem(PAIRING_SIDE_KEY)) || {}; } catch (e) {}

    // Ensure every team key exists and is an array
    ALL_TEAMS.forEach(t => {
        if (!Array.isArray(l4o[t])) l4o[t] = [];
    });

    // ---- LOUD VERIFICATION ----
    console.assert(Array.isArray(l4g), 'l4g loaded but is not an array');
    console.assert(typeof l4o === 'object' && l4o !== null, 'l4o loaded but is not an object');
    console.assert(typeof ps  === 'object' && ps  !== null, 'pairSides loaded but is not an object');
    ALL_TEAMS.forEach(t => {
        console.assert(Array.isArray(l4o[t]), `l4o[${t}] is not an array`);
    });
    console.log('[PAIRING] Loaded l4g=', l4g, ' l4o=', l4o, ' ps=', ps);

    return { l4g, l4o, ps };
}

// ---------- SAVE ----------
function savePairingState(l4g, l4o, ps) {
    try {
        localStorage.setItem(PAIRING_L4G_KEY,  JSON.stringify(l4g));
        localStorage.setItem(PAIRING_L4O_KEY,  JSON.stringify(l4o));
        localStorage.setItem(PAIRING_SIDE_KEY, JSON.stringify(ps));
    } catch (e) {
        console.warn('[PAIRING] Save failed:', e);
    }
}

// ---------- PICK ----------
function pickEligibleTeam(color, l4g, forbiddenOpponents) {
    const candidates = [];
    for (let d = 0; d < TEAMS_PER_COLOR; d++) {
        const id = teamId(color, d);
        if (l4g.includes(id)) continue;                                     // Gate 1
        if (forbiddenOpponents && forbiddenOpponents.includes(id)) continue; // Gate 2
        candidates.push(d);
    }
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
}

// ---------- SIDE RESOLUTION ----------
function resolveSide(redTeam, blueTeam, ps, randomSide) {
    const key = redTeam + '|' + blueTeam;
    const stored = ps[key];

    if (stored === undefined) {
        // First meeting → record the random side and use it
        ps[key] = (randomSide === 0) ? 'red-top' : 'blue-top';
        return randomSide;
    }
    // Rematch → flip
    const flipped = (stored === 'red-top') ? 1 : 0;
    ps[key] = (flipped === 0) ? 'red-top' : 'blue-top';
    return flipped;
}

// ---------- BUCKET EMPTY CHECKS ----------
function shouldEmptyL4G(l4g) {
    return l4g.length >= L4G_CAPACITY;
}

function shouldEmptyL4O(l4o) {
    for (let t of ALL_TEAMS) {
        if (l4o[t].length < L4O_CAPACITY) return false;
    }
    return true;
}

function emptyL4O(l4o) {
    ALL_TEAMS.forEach(t => { l4o[t] = []; });
}

// ============================================================
// Build 8 rows × up-to-10 entries of per-difficulty scores.
// Row order (matches the table): TOP color GEN,ADV,INT,BEG
//                                BOTTOM color GEN,ADV,INT,BEG
// Each entry: { scoreText: "2-1", result: 'green'|'yellow'|'white' }
// ============================================================
function buildMatchResultsTable() {
    let history = [];
    try {
        history = JSON.parse(localStorage.getItem(MATHSOCCER_RESULTS_KEY)) || [];
    } catch (e) {
        history = [];
    }

    const sideIsRedTop = (side === 0);
    const topColorName    = sideIsRedTop ? 'RED'  : 'BLUE';
    const bottomColorName = sideIsRedTop ? 'BLUE' : 'RED';

    const rowSpecs = [
        { colorName: topColorName,    diffIdx: 0 },
        { colorName: topColorName,    diffIdx: 1 },
        { colorName: topColorName,    diffIdx: 2 },
        { colorName: topColorName,    diffIdx: 3 },
        { colorName: bottomColorName, diffIdx: 0 },
        { colorName: bottomColorName, diffIdx: 1 },
        { colorName: bottomColorName, diffIdx: 2 },
        { colorName: bottomColorName, diffIdx: 3 }
    ];

    const table = rowSpecs.map(() => []);

    for (let i = 0; i < history.length; i++) {
        const g = history[i];

        for (let r = 0; r < rowSpecs.length; r++) {
    const spec = rowSpecs[r];
    const isRedRow = (spec.colorName === 'RED');
    const thisSideDiff = isRedRow ? g.redDiff : g.blueDiff;

    if (thisSideDiff !== spec.diffIdx) continue;

    let myVal, oppVal;

    if (gameOverTableMode === 'goals') {
        myVal  = isRedRow ? g.redGoals  : g.blueGoals;
        oppVal = isRedRow ? g.blueGoals : g.redGoals;
    } else if (gameOverTableMode === 'points') {
        myVal  = isRedRow ? g.redPoints  : g.bluePoints;
        oppVal = isRedRow ? g.bluePoints : g.redPoints;
    } else {
        // ── GUESSES MODE ──
        // Use either Option A or Option B here, not both.
        const correct = g.correctGuesses ?? 0;
        const total   = g.totalGuesses   ?? 0;
        const accuracy = total > 0 ? correct / total : 0;

        let result;
        if (accuracy >= 0.6)      result = 'green';
        else if (accuracy >= 0.3) result = 'yellow';
        else                      result = 'white';

        table[r].push({
            scoreText: correct + '/' + total,
            result: result
        });
        continue;
    }

    // goals / points path
    let result;
    if (myVal > oppVal)      result = 'green';
    else if (myVal < oppVal) result = 'yellow';
    else                     result = 'white';

    const scoreText = myVal + '-' + oppVal;
    table[r].push({ scoreText, result });
}
    }

    for (let r = 0; r < table.length; r++) {
        if (table[r].length > 10) {
            table[r] = table[r].slice(table[r].length - 10);
        }
    }

    return table;
}

function drawLandingButton3D(text, x, y, bgColor, textColor) {
    const cx = x + 14;
    const cy = y + 14;
    const r = 30;
    const colors = getButtonColors(bgColor);
    
    ctx.save();
    
    // Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 4;
    ctx.beginPath();

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    
    // MAIN BUTTON WITH 3D GRADIENT
    const grad = ctx.createRadialGradient(cx - 8, cy - 10, 2, cx, cy, r + 2);
    grad.addColorStop(0, colors.lightColor);
    grad.addColorStop(0.5, bgColor);
    grad.addColorStop(1, colors.darkColor);
    
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = grad;
    ctx.fill();
    
    // Specular highlight
    const highlightGrad = ctx.createRadialGradient(cx - 10, cy - 12, 1, cx - 5, cy - 7, r * 0.5);
    highlightGrad.addColorStop(0, 'rgba(255,255,255,0.4)');
    highlightGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = highlightGrad;
    ctx.fill();
    
    // Outline
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(cx, cy, 38, 0, 2 * Math.PI);
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'black';
    ctx.stroke();
    
    // Text
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 2;
    ctx.font = 'bold 14px fantasy, papyrus';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = textColor;
    ctx.fillText(text, cx + 1, cy + 2);
    
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = textColor;
    
    ctx.restore();
}

function draw3DBoard(ctx, x, y, w, h, depth, topColor, sideColor, innerTopColor, innerSideColor) {
  const inset = 2;
  const ix = x + inset, iy = y + inset, iw = w - inset*2, ih = h - inset*2;
  const innerDepth = 2;
  const d = depth; // 4

  // shadow - soft

  ctx.restore();

  ctx.fillStyle = sideColor;
  ctx.beginPath(); ctx.moveTo(x+w,y); ctx.lineTo(x+w+d,y+d*0.6); ctx.lineTo(x+w+d,y+h+d*0.6); ctx.lineTo(x+w,y+h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#143626';
  ctx.beginPath(); ctx.moveTo(x,y+h); ctx.lineTo(x+d*0.6,y+h+d*0.6); ctx.lineTo(x+w+d,y+h+d*0.6); ctx.lineTo(x+w,y+h); ctx.closePath(); ctx.fill();

  ctx.fillRect(x,y,w,h);

  // top specular highlight - glossy streak
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.beginPath();
  ctx.moveTo(x, y+1);
  ctx.lineTo(x+w, y+1);
  ctx.lineTo(x+w, y+h*0.42);
  ctx.lineTo(x, y+h*0.28);
  ctx.closePath();
  ctx.fill();
  // thin bright line
  ctx.fillStyle = 'rgba(255,255,255,0.75)';

  ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=1.5; ctx.strokeRect(x+0.75,y+0.75,w-1.5,h-1.5);

  ctx.fillStyle=innerSideColor;
  ctx.beginPath(); ctx.moveTo(ix+iw,iy); ctx.lineTo(ix+iw+innerDepth,iy+innerDepth*0.6); ctx.lineTo(ix+iw+innerDepth,iy+ih+innerDepth*0.6); ctx.lineTo(ix+iw,iy+ih); ctx.closePath(); ctx.fill();

  const gradInner = ctx.createLinearGradient(ix, iy, ix, iy+ih);
  gradInner.addColorStop(0, '#EFFFF2');
  gradInner.addColorStop(0.22, '#CCFFCC');

  gradInner.addColorStop(1, '#9ED99E');
  ctx.fillStyle = gradInner;

  ctx.fillStyle = 'rgba(255,255,255,0.85)';

        window.startFireworks = function() {
            console.log(
                '[START-FIREWORKS] called at t=' + performance.now().toFixed(1) +
                ' | stack:\n' + new Error().stack
            );
            return _origStartFireworks.apply(this, arguments);
        };
    }

    // Wrap announceGameOver
    const _origAnnounceGameOver = window.announceGameOver;
    if (typeof _origAnnounceGameOver === 'function') {
        window.announceGameOver = function() {
            console.log(
                '[ANNOUNCE-GAME-OVER] called at t=' + performance.now().toFixed(1) +
                ' | stack:\n' + new Error().stack
            );
            return _origAnnounceGameOver.apply(this, arguments);
        };
    }

    // Wrap speakText so you can see every speech triggered at game over
    const _origSpeakText = window.speakText;
    if (typeof _origSpeakText === 'function') {
        window.speakText = function(text, lang) {
            console.log(
                '[SPEAK] "' + String(text).slice(0, 80) + '..." at t=' +
                performance.now().toFixed(1) + ' | stack:\n' + new Error().stack
            );
            return _origSpeakText.apply(this, arguments);
        };
    }
})();

// ============================================================
//  CANVAS SETUP
// ============================================================

function initcanvas() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    cW = DESIGN_WIDTH;
    cH = DESIGN_HEIGHT;

    // Mark as cached for offline use
    localStorage.setItem('mathsoccer_cached', 'true');

    // Set container to actual window size
    const container = document.getElementById('gameContainer');
    if (container) {
        container.style.width  = window.innerWidth  + 'px';
        container.style.height = window.innerHeight + 'px';
    }

    // resizeCanvas() now handles DPR + visualViewport
    resizeCanvas();

    // Single consolidated resize handler (defined outside initcanvas)
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));

    // Setup touch, mouse, keyboard
    setupInputHandlers();
    setupDesktopControls();
    setupKeyboardControls();

    // Fallback audio resume (harmless; real unlock is on first touch)
    setTimeout(resumeAudio, 1000);

    g = 0;
    checkExistingUser();
    logo();
    setTimeout(showLandingPage, 3000);
}

window.addEventListener('load', function() {
    initcanvas();
});

// Re-acquire when page becomes visible again
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && matchInProgress) {
        requestWakeLock();
    }
});

</script>

   <!-- Desktop Controls -->

  <span class="icon-equals">=</span> Install 
</button>

<script>
// ============================================================
// SERVICE WORKER REGISTRATION
// ============================================================

if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        console.log('🔍 Registering Mathsoccer SW...');
        
        navigator.serviceWorker.register(
            '/MATHSOCCER-4aSide-/pwabuilder-sw.js',
            { 
                scope: '/MATHSOCCER-4aSide-/',
                updateViaCache: 'none'
            }
        )
        .then(function(registration) {
            console.log('✅ Mathsoccer SW registered!');
            console.log('📋 Scope:', registration.scope);
            
            // Check for waiting SW
            if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                console.log('🔄 New SW activated!');
            }
            
            // Listen for updates
            registration.addEventListener('updatefound', function() {
                const newWorker = registration.installing;
                console.log('🔄 Installing new SW...');
                
                newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'activated') {
                        console.log('✅ New SW active!');
                        window.location.reload();
                    }
                });
            });
        })
        .catch(function(error) {
            console.error('❌ SW registration failed:', error);
        });
    });
}

function updateInstallUI() {
    const btn = document.getElementById('installButton');
    if (!btn) return;
    btn.style.display = (isAppInstalled || !deferredPrompt) ? 'none' : 'block';
}

// Single beforeinstallprompt listener
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    if (isAppInstalled) return;
    deferredPrompt = e;
    console.log('📥 Install prompt ready');
    updateInstallUI();
});

// Single install function
async function installApp() {
    if (isAppInstalled) {
        console.log('Already installed');
        return;
    }
    if (!deferredPrompt) {
        console.log('No prompt - on iPhone use Share > Add to Home Screen');
        // iPhone fallback hint
        alert('On iPhone: Tap Share button (box with arrow) > Add to Home Screen to install');
        return;
    }
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice;
    console.log('Install outcome:', outcome);
    if (outcome === 'accepted') isAppInstalled = true;
    deferredPrompt = null;
    updateInstallUI();
}

// SINGLE click listener - no duplicates
document.getElementById('installButton')?.addEventListener('click', installApp);

// App installed event
window.addEventListener('appinstalled', () => {
    isAppInstalled = true;
    updateInstallUI();
    console.log('✅ Installed');
});

// Hide button initially if installed
updateInstallUI();

// Wake lock
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && typeof matchInProgress !== 'undefined' && matchInProgress && typeof requestWakeLock === 'function') {
        requestWakeLock();
    }
});

</script>
