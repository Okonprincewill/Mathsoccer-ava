// 1. Canvas roundRect (Chrome 99+, Safari 16+)
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (r > w / 2) r = w / 2;
        if (r > h / 2) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
    };
}

// 2. Array.from (Chrome 45+ — borderline for Intel 06)
if (!Array.from) {

    };
}

// 3. Array.prototype.includes (Chrome 47+)

// 7. Promise (Chrome 32+ — Intel 06 probably has it, but defensive)
// Only add if you use Promises (you do — Audio.play() returns one)
if (!window.Promise) {
    // Tiny polyfill — enough for audio .catch() chains
    window.Promise = function(executor) {
        var self = this;
        self._state = 0;
        self._value = undefined;
        self._handlers = [];
        function resolve(v) {
            if (self._state) return;
            self._state = 1;
            self._value = v;
            self._handlers.forEach(function(h) { h.onFulfilled && h.onFulfilled(v); });
        }
        function reject(v) {
            if (self._state) return;
            self._state = 2;
            self._value = v;
            self._handlers.forEach(function(h) { h.onRejected && h.onRejected(v); });
        }
        try { executor(resolve, reject); } catch (e) { reject(e); }
    };
    window.Promise.prototype.then = function(onFulfilled, onRejected) {
        var self = this;
        return new window.Promise(function(resolve, reject) {
            function handle() {
                try {
                    if (self._state === 1) {
                        resolve(onFulfilled ? onFulfilled(self._value) : self._value);
                    } else if (self._state === 2) {
                        if (onRejected) resolve(onRejected(self._value));
                        else reject(self._value);
                    }
                } catch (e) { reject(e); }
            }
            if (self._state) handle();
            else self._handlers.push({ onFulfilled: handle, onRejected: handle });
        });
    };
    window.Promise.prototype.catch = function(onRejected) {
        return this.then(null, onRejected);
    };
}

// ============================================================
// UNIVERSAL AUDIO & SPEECH FIX FOR ANDROID + IPHONE
// ============================================================
let audioUnlocked = false;
let audioCtx = null;
let masterGain = null;

function initAudioSystem() {
    if (audioUnlocked) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
        masterGain.gain.value = 0.8;
        
        // Create silent buffer to unlock iOS
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        audioUnlocked = true;
        console.log('🔊 Audio unlocked for', navigator.userAgent);
    } catch(e) {
        console.log('Audio init failed', e);
    }
}

// Unlock on ANY first interaction - critical for iPhone (SAFE - no early audio refs)
['touchstart','touchend','click','keydown'].forEach(evt => {
    window.addEventListener(evt, function handler() {
        initAudioSystem();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }, {once: true, passive: true});
});

// iPhone speech fix - load voices
let voicesReady = false;
function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) voicesReady = true;
}
if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
}

function universalSpeak(text, rate=1, pitch=1) {
    if (!('speechSynthesis' in window)) return;
    try {
        initAudioSystem();
        window.speechSynthesis.cancel();
        setTimeout(() => {
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = rate;
            utter.pitch = pitch;
            utter.volume = 1;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                // Prefer English voice that works on iOS
                const enVoice = voices.find(v => v.lang.includes('en-US')) || voices[0];
                utter.voice = enVoice;
            }
            // Keep audio alive during speech on iOS
            utter.onstart = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };
            window.speechSynthesis.speak(utter);
        }, 100);
    } catch(e) { console.log('Speak failed', e); }
}

function getScreenScaling() {
    const type = getScreenType();
    const w = window.innerWidth;
    const h = window.innerHeight;
    const ratio = w / h;
    
    let scaleX = w / DESIGN_W;
    let scaleY = h / DESIGN_H;
    
    // ✅ MINIMUM SCALE (prevent tiny UI on small screens)
    const MIN_SCALE = 0.7;
    scaleX = Math.max(scaleX, MIN_SCALE);
    scaleY = Math.max(scaleY, MIN_SCALE);
    
    // ✅ MAXIMUM SCALE (prevent giant UI on huge screens)
    const MAX_SCALE = 2.5;
    scaleX = Math.min(scaleX, MAX_SCALE);
    scaleY = Math.min(scaleY, MAX_SCALE);
    
    // ✅ ULTRAWIDE SPECIFIC CAP
    if (ratio > 2) {
        const ULTRAWIDE_MAX = 2.0;
        scaleX = Math.min(scaleX, ULTRAWIDE_MAX);
        scaleY = Math.min(scaleY, ULTRAWIDE_MAX);
    }
    
    let fitMode;
    switch(type) {
        case 'phone': fitMode = 'width'; break;
        case 'tablet': fitMode = 'contain'; break;
        case 'desktop': fitMode = 'height'; break;
        case 'ultrawide': fitMode = 'width'; break;
        default: fitMode = 'contain';
    }
    
    return {
        type: type,
        scaleX: scaleX,
        scaleY: scaleY,
        fitMode: fitMode,
        w: w,
        h: h
    };
}

// EASING FUNCTIONS

// Linear (no ease)
function linear(t) { return t; }

// Ease out (slow at end) - good for arm reaching target
function easeOutQuad(t) { return t * (2 - t); }

// Ease in (slow at start) - good for arm starting to move
function easeInQuad(t) { return t * t; }

// Ease in-out (slow at both ends) - good for smooth looping
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

// Elastic (bounce at end) - good for goal celebrations
function easeOutElastic(t) {
    const c4 = (2 * Math.PI) / 3;
    return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
}

// Back (overshoot then return) - good for button clicks
function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

let gamePaused = false;

const SPEED_OPTIONS = [0.5, 1, 2, 3];
let speedIndex = 1;

// Two separate pools:
//   - pendingDelays: pure delays that CAN re-arm on speed change
//   - runningAnimations: animations already started, NEVER re-armed
let pendingDelays = [];

// Original timing constants — scaled by speed
const BASE_AUTO_MOVE_DELAY = 7000;
const BASE_COMP_DELAY      = 10000;
const BASE_ANIM_DURATION   = 1000;
const BASE_PULSE_DURATION  = 7000;
const BASE_CALC_DURATION   = 3000;

// ✅ FLOOR — no timer may ever be shorter than this.
// Set to slightly more than the longest atomic animation so overlap
// is impossible even at 3× speed.
const SCALED_FLOOR_MS = 600;
const PHASE = {
    HIGHLIGHT: 900,

};

function inMove(ms) {

function inArm() {

// Track pending timeouts so pause/resume works
let pausedTimeouts = [];

function setGuessWindow(ms) {
    guessWindowMs = ms;
    localStorage.setItem('mathsoccer_guess_window', String(ms));
    requestRedraw();

function scaled(delayUnscaled) {
    return Math.max(SCALED_FLOOR_MS, Math.round(delayUnscaled / gameSpeedMultiplier));
}

// ─────────────────────────────────────────────
// gameSetTimeout — PURE DELAY timer
// Re-arms cleanly on speed change because the callback has NOT started yet.
// ─────────────────────────────────────────────
function gameSetTimeout(callback, delayUnscaled) {
    const entry = {
        callback: callback,
        originalDelay: delayUnscaled,   // UNSCALED ms
        startTime: performance.now(),
        id: null
    };

    const schedule = (delayMs) => {
        entry.id = setTimeout(() => {
            const idx = pendingDelays.indexOf(entry);
            if (idx > -1) pendingDelays.splice(idx, 1);

            if (gamePaused) {
                // Freeze: put back into the pool with remaining unscaled time
                const elapsed = performance.now() - entry.startTime;
                entry.originalDelay = Math.max(0, entry.originalDelay - elapsed);
                entry.startTime = performance.now();
                pendingDelays.push(entry);
                return;
            }
            callback();
        }, delayMs);
    };

    schedule(scaled(delayUnscaled));
    pendingDelays.push(entry);
    return entry.id;
}

// ─────────────────────────────────────────────
// cycleSpeed — re-arm ONLY pure delays
// Animations read gameSpeedMultiplier live from their own RAF loops,
// so nothing to re-arm there.
// ─────────────────────────────────────────────
function cycleSpeed() {
    speedIndex = (speedIndex + 1) % SPEED_OPTIONS.length;
    gameSpeedMultiplier = SPEED_OPTIONS[speedIndex];

    const now = performance.now();

    for (let entry of pendingDelays) {
        if (!entry.id) continue;
        clearTimeout(entry.id);

        const elapsed = now - entry.startTime;
        const unscaledRemaining = Math.max(0, entry.originalDelay - elapsed);

        entry.originalDelay = unscaledRemaining;
        entry.startTime = now;

        const delayMs = scaled(unscaledRemaining);
        entry.id = setTimeout(() => {
            const idx = pendingDelays.indexOf(entry);
            if (idx > -1) pendingDelays.splice(idx, 1);
            if (gamePaused) {
                const el = performance.now() - entry.startTime;
                entry.originalDelay = Math.max(0, entry.originalDelay - el);
                entry.startTime = performance.now();
                pendingDelays.push(entry);
                return;
            }
            entry.callback();
        }, delayMs);
    }

    // Redraw the HUD only (do NOT re-render the board — that's what scatters tokens)
    drawSpeedHUD();
}

// ============================================================
// gameSetTimeoutReal — a delay NOT scaled by gameSpeedMultiplier.
// ============================================================
let realTimeouts = [];

function gameSetTimeoutReal(callback, delayMs) {
    const entry = {
        callback: callback,
        originalDelay: delayMs,
        startTime: performance.now(),
        id: null
    };

    entry.id = setTimeout(() => {
        const idx = realTimeouts.indexOf(entry);
        if (idx > -1) realTimeouts.splice(idx, 1);
        if (gamePaused) {
            const elapsed = performance.now() - entry.startTime;
            entry.originalDelay = Math.max(0, entry.originalDelay - elapsed);
            entry.startTime = performance.now();
            realTimeouts.push(entry);
            return;
        }
        callback();
    }, delayMs);

    realTimeouts.push(entry);
    return entry.id;
}

// ============================================================
//  RESIZE CANVAS — No overflow, minimal black bars
// ============================================================
function resizeCanvas() {
    let screenW, screenH;
    if (window.visualViewport) {
        screenW = window.visualViewport.width;
        screenH = window.visualViewport.height;
    } else {
        screenW = window.innerWidth;
        screenH = window.innerHeight;
    }

    const dpr = Math.min(window.devicePixelRatio || 1, 3); // cap at 3 for perf

    canvas.width  = Math.floor(360 * dpr);
    canvas.height = Math.floor(800 * dpr);

    canvas.style.width  = screenW + 'px';
    canvas.style.height = screenH + 'px';
    canvas.style.position = 'fixed';
    canvas.style.left = '0';
    canvas.style.top = '0';
    canvas.style.transform = 'none';
    canvas.style.maxWidth = 'none';   // ← prevents CSS max-width from shrinking it
    canvas.style.maxHeight = 'none';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // scale once, not per draw

    window._dpr = dpr;   // ← needed by showCalculationAnimation + moveManimation

    cW = 360;
    cH = 800;

    redrawGameScreen();
}


function handleResize() {
    const currentHeight = window.innerHeight;
    const isKeyboardOpen = currentHeight < previousHeight;

    // ✅ Keyboard open — ignore this resize event
    if (isKeyboardOpen) {
        previousHeight = currentHeight;
        return;
    }

    previousHeight = currentHeight;

    // ✅ Update container size immediately
    const container = document.getElementById('gameContainer');
    if (container) {
        container.style.width  = window.innerWidth  + 'px';
        container.style.height = window.innerHeight + 'px';
    }

    // ✅ Debounced canvas resize + iOS --vh fix
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        resizeCanvas();
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }, 300);
}

// ============================================================

function isTouchDevice() {
    return ('ontouchstart' in window) || 
           (navigator.maxTouchPoints > 0) || 
           (navigator.msMaxTouchPoints > 0);
}

function getScaledTouch(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const DESIGN_W = 360;
    const DESIGN_H = 800;
    
    // ✅ Convert screen → canvas using the actual display size
    const scaleX = DESIGN_W / rect.width;
    const scaleY = DESIGN_H / rect.height;
    
    let canvasX = (clientX - rect.left) * scaleX;
    let canvasY = (clientY - rect.top) * scaleY;
    
    // ✅ Clamp to canvas bounds (safety)
    canvasX = Math.max(0, Math.min(DESIGN_W, canvasX));
    canvasY = Math.max(0, Math.min(DESIGN_H, canvasY));
    
    return { x: canvasX, y: canvasY };
}

// ============================================================
//  DEVICE DETECTION
// ============================================================

function getDeviceType() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const ratio = w / h;
    
    if (w >= 1024 && ratio > 1.2) return 'desktop';
    if (w >= 768 && w < 1024) return 'tablet';
    if (w < 768) return 'phone';
    if (ratio > 2) return 'ultrawide';
    return 'unknown';
}

function isDesktop() { return getDeviceType() === 'desktop'; }
function isTablet() { return getDeviceType() === 'tablet'; }
function isPhone() { return getDeviceType() === 'phone'; }
function isUltrawide() { return getDeviceType() === 'ultrawide'; }


// ============================================================
//  DEVICE-SPECIFIC TOUCH TOLERANCE — CORRECTED
// ============================================================

function getDeviceTouchTolerance() {
    const device = getDeviceType();
    const isTouch = isTouchDevice();
    
    // ✅ Touch devices need larger hit areas
    if (isTouch) {
        switch(device) {
            case 'phone': return 12;      // Small screen, big fingers
            case 'tablet': return 15;     // Larger screen, bigger fingers
            case 'desktop': return 10;    // Touch on desktop
            case 'ultrawide': return 12;
            default: return 10;
        }
    }
    
    // ✅ Mouse users are precise
    return 4;
}

            const currentTag = btn.tag || '';
            const newTag = prompt(`Enter new tag for button ${btn.id}:`, currentTag);
            
            if (newTag !== null && newTag.trim() !== '') {
                btn.tag = newTag.trim();
                
                // Update the correct tag store
                if (isPlayer) {
                    playerTags[btn.id] = newTag.trim();
                } else {
                    opponentTags[btn.id] = newTag.trim();
                }
                saveTags();
                
                // Redraw
                ctx.clearRect(0, 0, cW, cH);
                renderAnswer();
                renderButtons();
                renderStats();
                statDraw(va, vb, vc, vd, ve, vf, vg, vh);
                drawToggles();
                if (selectedButton) {
                    highlightButtonAndNumbers(selectedButton, selectedButtonLinks);
                }
            }
            return true;
        }
    }
    return false;
}

    FIRST_WIN: { id: 'FIRST_WIN', name: 'First Victory', icon: '🏆', description: 'Win your first game', unlocked: false },
    GENIUS: { id: 'GENIUS', name: 'Genius Level winner', icon: '🧠', description: 'Win on Genius difficulty', unlocked: false },
    HAT_TRICK: { id: 'HAT_TRICK', name: 'Hat Trick', icon: '🎩', description: 'Score 3 goals in one game', unlocked: false }
};

let unlockedAchievements = [];
let newAchievementsThisGame = [];

function checkAchievements() {
    newAchievementsThisGame = [];
    
    // Determine player's goals based on side
    const playerGoals = (side === 0) ? redGoal : blueGoal;
    const opponentGoals = (side === 0) ? blueGoal : redGoal;
    const playerWon = playerGoals > opponentGoals;
    const playerDraw = playerGoals === opponentGoals;
    
    // FIRST GOAL — any goal scored by player
    if (playerGoals >= 1 && !ACHIEVEMENTS.FIRST_GOAL.unlocked) {
        unlockAchievement('FIRST_GOAL');
    }
    
    // FIRST WIN — player must win
    if (playerWon && !ACHIEVEMENTS.FIRST_WIN.unlocked) {
        unlockAchievement('FIRST_WIN');
    }
    
    // GENIUS — player wins on Genius difficulty
    if (l === 0 && playerWon && !ACHIEVEMENTS.GENIUS.unlocked) {
        unlockAchievement('GENIUS');
    }
    
    // HAT TRICK — player scores 3 or more goals
    if (playerGoals >= 3 && !ACHIEVEMENTS.HAT_TRICK.unlocked) {
        unlockAchievement('HAT_TRICK');
    }
}

    if (ACHIEVEMENTS[id] && !ACHIEVEMENTS[id].unlocked) {

// ===========================================
// FIREWORKS - 3D ENHANCED
// ===========================================

let fireworksParticles = [];
let fireworksAnimationId = null;
let fireworksStartTime = 0;
let fireworksDuration = 10000;
let isFireworksRunning = false;

function createFirework(x, y) {
    const colors = ['#FF0000', '#FFD700', '#00FF00', '#00BFFF', '#FF00FF', '#FF4500', '#FFFFFF', '#FF1493', '#FF6B00', '#00FF7F'];
    const particleCount = 50 + Math.floor(Math.random() * 40);
    
    for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * 2 * Math.PI;
        const speed = 2 + Math.random() * 6;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = 0.5 + Math.random() * 5;
        const trail = Math.random() > 0.7;
        
        fireworksParticles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.5,
            life: 1.0,
            decay: 0.006 + Math.random() * 0.012,
            color: color,
            size: size,
            trail: trail,
            trailPositions: trail ? [{x: x, y: y}] : []
        });
    }
}

function spawnFirework() {
    const x = 30 + Math.random() * 280;  // Random X within canvas
    const y = 530 + Math.random() * 380;  // Random Y within canvas
    createFirework(x, y);
}

function updateFireworks(deltaMs) {
    const factor = (deltaMs || 16.67) / 16.67;

    for (let i = fireworksParticles.length - 1; i >= 0; i--) {
        const p = fireworksParticles[i];
        p.x += p.vx * factor;
        p.y += p.vy * factor;
        p.vy += 0.06 * factor;
        p.vx *= Math.pow(0.99, factor);
        p.vy *= Math.pow(0.99, factor);
        p.life -= p.decay * factor;

        if (p.trail) {
            p.trailPositions.push({x: p.x, y: p.y});
            if (p.trailPositions.length > 8) {
                p.trailPositions.shift();
            }
        }

        if (p.life <= 0) {
            fireworksParticles.splice(i, 1);
        }
    }
}


function drawFireworks() {
    // === DRAW TRAILS ===
    for (let p of fireworksParticles) {
        if (p.trail && p.trailPositions.length > 1) {
            for (let t = 0; t < p.trailPositions.length - 1; t++) {
                const alpha = (t / p.trailPositions.length) * p.life * 0.5;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(p.trailPositions[t].x, p.trailPositions[t].y, p.size * 0.3 * (t / p.trailPositions.length), 0, 2 * Math.PI);
                ctx.fill();
            }
        }
    }
    
    // === DRAW PARTICLES ===
    for (let p of fireworksParticles) {
        ctx.globalAlpha = p.life * 0.9;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life + 1, 0, 2 * Math.PI);
        ctx.fill();
        
        // Inner glow
        ctx.shadowBlur = 40;
        ctx.globalAlpha = p.life * 0.3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life * 0.3, 0, 2 * Math.PI);
        ctx.fill();
    }
    
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}

// ===========================================
// START FIREWORKS
// ===========================================

function startFireworks() {
    animationInProgress = true;
    touchEnabled = false;
    fireworksParticles = [];
    fireworksStartTime = performance.now();
    isFireworksRunning = true;

    if (fireworksAnimationId) {
        cancelAnimationFrame(fireworksAnimationId);
    }

    let lastFrameTime = null;
    let frameCount = 0;

    function animateFireworks(timestamp) {
        const elapsed = timestamp - fireworksStartTime;

        if (elapsed >= fireworksDuration) {
            isFireworksRunning = false;
            fireworksAnimationId = null;
            animationInProgress = false;
            touchEnabled = true;
            renderGameOverScreen();
            return;
        }

        const deltaMs = lastFrameTime ? (timestamp - lastFrameTime) : 16.67;
        lastFrameTime = timestamp;

        if (Math.random() < 0.15) spawnFirework();
        if (Math.random() < 0.10) spawnFirework();

        updateFireworks(deltaMs);

        frameCount++;
        if (frameCount % 3 === 0) {
            renderGameOverScreen();
        } else {
            ctx.save();
            drawFireworks();
            ctx.restore();
        }

        fireworksAnimationId = requestAnimationFrame(animateFireworks);
    }

    fireworksAnimationId = requestAnimationFrame(animateFireworks);
}


function stopFireworks() {
    if (fireworksAnimationId) {
        cancelAnimationFrame(fireworksAnimationId);
        fireworksAnimationId = null;

// ===========================================
// GAME OVER ANNOUNCEMENT
// ===========================================
function announceGameOver() {
    const playerColor = (side === 0) ? 'red' : 'blue';
    const aiColor = (side === 0) ? 'blue' : 'red';
    
    const playerGoals = (playerColor === 'red') ? redGoal : blueGoal;
    const aiGoals = (aiColor === 'red') ? redGoal : blueGoal;
    const playerPoints = (playerColor === 'red') ? redPoints : bluePoints;
    const aiPoints = (aiColor === 'red') ? redPoints : bluePoints;
    
    const movesCompleted = n - 1;
    
    // Calculate circles
    let playerCircles = 0;
    let aiCircles = 0;
    for (let entry of gameHistory) {
        if (entry.col === playerColor) {
            playerCircles += entry.cir || 0;
        } else if (entry.col === aiColor) {
            aiCircles += entry.cir || 0;
        }
    }
    
    // Scorers
    let playerScorersList = scorer.filter(g => g.col === playerColor).map(g => g.id).join(', ');
    let aiScorersList = scorer.filter(g => g.col === aiColor).map(g => g.id).join(', ');
    
    let playerScorerText = playerScorersList ? `${playerColor} scorer: ${playerScorersList}` : `No ${playerColor} scorer`;
    let aiScorerText = aiScorersList ? `${aiColor} scorer: ${aiScorersList}` : `No ${aiColor} scorer`;
    
    // Determine result
    let resultType = '';
    let humanWon = false;
    let resultMessage = '';
    
    // 1. CHECK GOALS
    if (playerGoals > aiGoals) {
        resultType = 'win';
        humanWon = true;
        resultMessage = `${playerScorerText}. ${aiScorerText}.`;
    } 
    else if (aiGoals > playerGoals) {
        resultType = 'loss';
        humanWon = false;
        resultMessage = ``;
    }
    
    // 2. GOALS DRAW - CHECK POINTS
    else if (playerGoals === aiGoals) {
        if (playerPoints > aiPoints) {
            resultType = 'win';
            humanWon = true;
            resultMessage = `This game is over after ${movesCompleted} moves. It's a draw at ${playerGoals} goal to ${aiGoals}`;
        }
        else if (aiPoints > playerPoints) {
            resultType = 'loss';
            humanWon = false;
            resultMessage = ``;
        }
        
        // 3. GOALS AND POINTS DRAW - CHECK CIRCLES
        else if (playerPoints === aiPoints) {
            if (playerCircles > aiCircles) {
                resultType = 'win';
                humanWon = true;
                resultMessage = ``;
            }
            else if (aiCircles > playerCircles) {
                resultType = 'loss';
                humanWon = false;
                resultMessage = ``;
            }
            
            // 4. EVERYTHING DRAW - TOTAL DRAW
            else {
                resultType = 'draw';
                humanWon = false;
                resultMessage = ``;
            }
        }
    }
    
    //playSound(inland);
    // === SPEAK ANNOUNCEMENT ===
    speakText(resultMessage);       
    
    // === RETURN RESULT ===
    return {
        message: resultMessage,
        type: resultType,
        humanWon: humanWon,
        playerGoals: playerGoals,
        aiGoals: aiGoals,
        playerPoints: playerPoints,
        aiPoints: aiPoints,
        playerCircles: playerCircles,
        aiCircles: aiCircles,
        movesCompleted: movesCompleted,
        playerColor: playerColor,
        aiColor: aiColor,
        playerScorers: playerScorersList,
        aiScorers: aiScorersList
    };
}

function showSimpleArm(button, targetCell) {
    if (armSimpleAnimationId) {
        cancelAnimationFrame(armSimpleAnimationId);
        armSimpleAnimationId = null;   // ← ADD THIS
    }

    animationInProgress = true;
    touchEnabled = false;

    const startX = button.x + 16;
    const startY = button.y + 16;
    const endX   = targetCell.x + 19;
    const endY   = targetCell.y + 19;

    const buttonColor = button.col;
const buttonId    = button.id;
const BASE_DURATION = ARM_BASE_MS;
const armDurationMs = inArm();

   // ✅ Arm is the *announcement* of the move — never let it go below
//    a perceptible duration, even at 3× speed.

const ARM_MIN_VISIBLE_MS = 220;  // never faster than ~4 frames at 60 fps  
    // ✅ Team-colored arm — EXACT match to frameDirectLinks palette
// (frameDirectLinks draws its threat circles with #FF0000 / #0000FF)
const armColor     = (button.col === 'red')  ? '#FF0000' :
                     (button.col === 'blue') ? '#0000FF' :
                                               '#3498DB';
const armColorDark = (button.col === 'red')  ? '#990000' :
                     (button.col === 'blue') ? '#000033' :  // ← darker navy for blue
                                               '#145A32';

    // Bake static scene (identity transform)
const dpr = window._dpr || 1;

const baseCanvas = document.createElement('canvas');
baseCanvas.width  = 360 * dpr;
baseCanvas.height = 800 * dpr;
const baseCtx = baseCanvas.getContext('2d');

const save0 = ctx;
ctx = baseCtx;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
ctx.clearRect(0, 0, 360, 800);
renderAnswer();
renderButtons();
renderStats();
statDraw(va, vb, vc, vd, ve, vf, vg, vh);
drawScorer();
if (selectedButton) {
    highlightButtonAndNumbers(selectedButton, selectedButtonLinks);
}
drawToggles();
ctx = save0;

    const offCanvas = document.createElement('canvas');
offCanvas.width  = 360 * dpr;
offCanvas.height = 800 * dpr;
const offCtx = offCanvas.getContext('2d');

    let startTime  = null;
    let lastFrameT = 0;
    let pausedAt   = 0;                 // ← tracks pause freeze point
    let accumulatedPause = 0;           // ← total paused ms so far

    function animate(timestamp) {
        // ── Handle pause: freeze the clock ──
        if (gamePaused) {
            if (!pausedAt) pausedAt = timestamp;
            armSimpleAnimationId = requestAnimationFrame(animate);
            return;
        }
        if (pausedAt) {
            accumulatedPause += timestamp - pausedAt;
            pausedAt = 0;
        }

        if (!startTime) startTime = timestamp;

        // Frame-rate gate (30 fps)
        if (timestamp - lastFrameT < FRAME_MS) {
            armSimpleAnimationId = requestAnimationFrame(animate);
            return;
        }
        lastFrameT = timestamp;

        // ── Speed-aware progress, but floored at a visible minimum ──
// At 3× the arm would otherwise finish in ~167 ms; we cap the
// effective speed for the arm so it always reads as "a hand
// reaching for the cell" rather than a flash.
const armDurationMs = Math.max(ARM_MIN_VISIBLE_MS, BASE_DURATION / gameSpeedMultiplier);
const effectiveElapsed = timestamp - startTime - accumulatedPause;
const progress = Math.min(effectiveElapsed / armDurationMs, 1);

        const eased    = 1 - Math.pow(1 - progress, 2);

        const currentX = startX + (endX - startX) * eased;
        const currentY = startY + (endY - startY) * eased;

        // Compose frame
const saveInner = ctx;
ctx = offCtx;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
ctx.clearRect(0, 0, 360, 800);
ctx.drawImage(baseCanvas, 0, 0, 360, 800);

        // Arm line — team color
ctx.beginPath();
ctx.moveTo(startX, startY);
ctx.lineTo(currentX, currentY);
ctx.strokeStyle = armColor;
ctx.lineWidth = 10;
ctx.lineCap = 'round';
ctx.stroke();
// Darker outline for depth
ctx.beginPath();
ctx.moveTo(startX, startY);
ctx.lineTo(currentX, currentY);
ctx.strokeStyle = armColorDark;
ctx.lineWidth = 2;
ctx.stroke();

        // Hand
        ctx.beginPath();
        ctx.arc(currentX, currentY, 14, 0, 2 * Math.PI);
        ctx.fillStyle = '#FDBCB4';
        ctx.fill();
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Finger
        const angle   = Math.atan2(endY - startY, endX - startX);
        const fingerX = currentX + Math.cos(angle) * 14;
        const fingerY = currentY + Math.sin(angle) * 14;
        ctx.beginPath();
        ctx.moveTo(currentX, currentY);
        ctx.lineTo(fingerX, fingerY);
        ctx.strokeStyle = '#FDBCB4';
        ctx.lineWidth = 5;
        ctx.stroke();

        // Original button
        ctx.beginPath();
        ctx.arc(startX, startY, 18, 0, 2 * Math.PI);
        ctx.fillStyle = buttonColor;
        ctx.fill();
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2;
        ctx.stroke();

        const grd = ctx.createRadialGradient(startX - 6, startY - 6, 0, startX - 6, startY - 6, 4);
        grd.addColorStop(0, 'white');
        grd.addColorStop(1, 'black');
        ctx.beginPath();
        ctx.arc(startX - 6, startY - 6, 4, 0, 2 * Math.PI);
        ctx.fillStyle = grd;
        ctx.fill();

        ctx.font = 'bold 18px fantasy, papyrus';
        ctx.fillStyle = '#CFC';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(buttonId, startX, startY + 2);

        ctx = saveInner;

        // Blit to main
resetMainTransform();
ctx.clearRect(0, 0, 360, 800);
ctx.drawImage(offCanvas, 0, 0, 360, 800);

        if (progress < 1) {
            armSimpleAnimationId = requestAnimationFrame(animate);
        } else {
            armSimpleAnimationId = null;
            animationInProgress  = false;
            touchEnabled         = true;

            resetMainTransform();
            ctx.clearRect(0, 0, 360, 800);
            renderAnswer();
            renderButtons();
            renderStats();
            statDraw(va, vb, vc, vd, ve, vf, vg, vh);
            if (selectedButton) {
                highlightButtonAndNumbers(selectedButton, selectedButtonLinks);
            }
            drawToggles();
        }
    }

    armSimpleAnimationId = requestAnimationFrame(animate);
}

function countThreatenedPositions(button) {
    if (!button) return 0;
    
    let count = 0;
    const allDirs = ['right', 'left', 'up', 'down', 'up-left', 'up-right', 'down-left', 'down-right'];
    
    // Use the button's color to determine attacker
    const attackerColor = button.col;
    
    const topGoalColor = answer[0] ? answer[0].col : null;
    const bottomGoalColor = answer[36] ? answer[36].col : null;
    
    for (let i = 0; i < answer.length; i++) {
        const pos = answer[i];
        if (!pos) continue;
        if (i === 0 || i === 36) continue;
        if (pos.col !== 'white' && pos.col !== 'yellow') continue;
        if (pos.occupancy !== 'no') continue;
        
        let goalColor = null;
        let goal = null;
        if (pos.y < 300) {
            goal = answer[0];
            goalColor = topGoalColor;
        } else {
            goal = answer[36];
            goalColor = bottomGoalColor;
        }
        if (!goal || !goalColor) continue;
        
        const dx = goal.x - pos.x;
        const dy = goal.y - pos.y;
        
        let goalDirection = '';
        if (dx === 0 && dy < 0) goalDirection = 'up';
        else if (dx === 0 && dy > 0) goalDirection = 'down';
        else if (dy === 0 && dx < 0) goalDirection = 'left';
        else if (dy === 0 && dx > 0) goalDirection = 'right';
        else if (dx > 0 && dy > 0) goalDirection = 'down-right';
        else if (dx < 0 && dy > 0) goalDirection = 'down-left';
        else if (dx > 0 && dy < 0) goalDirection = 'up-right';
        else if (dx < 0 && dy < 0) goalDirection = 'up-left';
        
        const cellDir = categorizeButtonsByDirection(pos);
        const buttonsInGoalDir = cellDir && cellDir[goalDirection];
        
        // Check if blocked by defender (same color as goal)
        let isBlocked = false;
        if (buttonsInGoalDir && buttonsInGoalDir.length > 0) {
            const firstButton = buttonsInGoalDir[0];
            if (firstButton.col === goalColor) {
                isBlocked = true;
            }
        }
        if (isBlocked) continue;
        
        // Check for threat - only count if threat matches attacker color
        let hasThreat = false;
        for (let dir of allDirs) {
            const btn = cellDir && cellDir[dir] && cellDir[dir][0];
            // Threat must be the attacker's color and different from goal
            if (btn && btn.col !== goalColor && btn.col === attackerColor) {
                hasThreat = true;
                break;
            }
        }
        if (hasThreat) count++;
    }
    
    return count;
}

function lightenColor(color, percent) {
    if (color.startsWith('#')) {
        let r = parseInt(color.slice(1, 3), 16);
        let g = parseInt(color.slice(3, 5), 16);
        let b = parseInt(color.slice(5, 7), 16);
        r = Math.min(255, r + percent);
        g = Math.min(255, g + percent);
        b = Math.min(255, b + percent);
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
    }
    return color;
}

// ===========================================
// HELPER: DARKEN COLOR
// ===========================================

function darkenColor(color, percent) {
    if (color.startsWith('#')) {
        let r = parseInt(color.slice(1, 3), 16);
        let g = parseInt(color.slice(3, 5), 16);
        let b = parseInt(color.slice(5, 7), 16);
        r = Math.max(0, r - percent);
        g = Math.max(0, g - percent);
        b = Math.max(0, b - percent);
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
    }
    return color;
}

    // Find existing entry or create new one
    let entry = currentLogData.exemptedNumbers.find(e => e.id === number);
    if (!entry) {
        entry = { id: number, reasons: [] };
        currentLogData.exemptedNumbers.push(entry);
    }
    if (!entry.reasons.includes(reason)) {
        entry.reasons.push(reason);
    }

            col: cell.col,

        })),

        })),

        m: m,
        n: n,
        h: h,
        g: g,
        side: side,
        scorer: scorer.map(s => ({ ...s })),
        // ✅ Simplified lastMoveData (only what's needed)
        lastMoveData: lastMoveData ? {
            button: lastMoveData.button ? {
                id: lastMoveData.button.id,
                col: lastMoveData.button.col
            } : null,
            targetCell: lastMoveData.targetCell ? {
                id: lastMoveData.targetCell.id
            } : null,

                id: lastMoveData.sourceCell.id
            } : null,
            chanceType: lastMoveData.chanceType,
            points: lastMoveData.points,
            moveTeam: lastMoveData.moveTeam,
            nextTeam: lastMoveData.nextTeam
        } : null,
        // ✅ Scorer positions (for mover and scorer redraw)
        topX: topX,
        topY: topY,
        botX: botX,
        botY: botY,
        // ✅ Stats values (from preAnim updates)
        statsValues: stats.map(s => ({
            value: s.value,
            col: s.col
        })),
        calcValue: calc.value
    };
    
    if (currentHistoryIndex < moveHistory.length - 1) {
        moveHistory = moveHistory.slice(0, currentHistoryIndex + 1);
    }
    
    moveHistory.push(state);
    currentHistoryIndex = moveHistory.length - 1;
    
    if (moveHistory.length > MAX_HISTORY) {
        moveHistory.shift();
        currentHistoryIndex--;
    }
}


// ===========================================

// ===========================================
function restoreState(index) {
    const state = moveHistory[index];
    if (!state) return;
    
    // Restore board
    state.board.forEach((savedCell, i) => {
        if (i < answer.length) {
            answer[i].occupancy = savedCell.occupancy;
        }
    });
    
    // Restore buttons
    state.buttons.forEach((savedBtn, i) => {
        if (i < buttons.length) {
            buttons[i].x = savedBtn.x;
            buttons[i].y = savedBtn.y;
        }
    });
    
    // Restore game variables
    redGoal = state.redGoal;
    blueGoal = state.blueGoal;
    redPoints = state.redPoints;
    bluePoints = state.bluePoints;
    problemFactor = state.problemFactor;
    r = state.r;
    m = state.m;
    n = state.n;
    h = state.h;
    g = state.g;
    side = state.side;
    scorer = state.scorer.map(s => ({ ...s }));
    
    // ✅ Restore simplified lastMoveData
    if (state.lastMoveData) {
        // Reconstruct button object (only id and col needed)
        const button = state.lastMoveData.button ? {
            id: state.lastMoveData.button.id,

            moveTeam: state.lastMoveData.moveTeam,
            nextTeam: state.lastMoveData.nextTeam
        };
    } else {

    }

                if (s.col !== undefined) {
                    stats[i].col = s.col;

                redCircles += entry.cir || 0;
            } else if (entry.col === 'blue') {
                blueCircles += entry.cir || 0;
            }
        }
    }
    return { redCircles, blueCircles };
}

let splashSkipped = false;
let loadingProgress = 0;
let loadingAnimationId = null;

function startLoadingAnimation() {
    loadingProgress = 0;
    
    function animateLoading() {
    if (gamePaused) {
        animationFrameId = requestAnimationFrame(animate);
        return;
    }
        if (splashSkipped) return;
        
        const elapsed = Date.now() - splashStartTime;
        const progress = Math.min(elapsed / 2500, 1); // 2.5 seconds max
        
        // Redraw progress bar only (optimization)
        ctx.fillStyle = '#064';
        ctx.fillRect(70, 700, 220, 8);
        ctx.fillStyle = '#CFC';
        ctx.fillRect(70, 700, 220 * progress, 8);
        
        if (progress < 1) {
            loadingAnimationId = requestAnimationFrame(animateLoading);
        }
    }
    
    animateLoading();
}

function finishSplash() {
    // Ensure minimum display time (prevents flicker on fast skip)
    const elapsed = Date.now() - splashStartTime;
    if (elapsed < 1500 && !splashSkipped) {
        setTimeout(finishSplash, 1500 - elapsed);
        return;
    }
}

function drawGlossyBackground() {
    ctx.save();
    
    // === LIGHTER DARK GREEN BASE ===
    const baseGrad = ctx.createRadialGradient(180, 375, 50, 180, 375, 350);  // Y+25
    baseGrad.addColorStop(0, '#2a6a2a');
    baseGrad.addColorStop(0.3, '#1a551a');
    baseGrad.addColorStop(0.6, '#0f3f0f');
    baseGrad.addColorStop(0.8, '#0a2f0a');
    baseGrad.addColorStop(1, '#062006');
    ctx.fillStyle = baseGrad;
    ctx.fillRect(0, 0, cW, cH);
    
    // === GLOSSY SHINE ===
    // Main shine (top-left)
    const shineGrad = ctx.createRadialGradient(90, 175, 20, 90, 175, 300);  // Y+25
    shineGrad.addColorStop(0, 'rgba(144, 238, 144, 0.12)');
    shineGrad.addColorStop(0.3, 'rgba(144, 238, 144, 0.06)');
    shineGrad.addColorStop(1, 'rgba(144, 238, 144, 0)');
    ctx.fillStyle = shineGrad;
    ctx.fillRect(0, 0, cW, cH);
    
    // Secondary shine (bottom-right)
    const shineGrad2 = ctx.createRadialGradient(290, 575, 20, 290, 575, 300);  // Y+25
    shineGrad2.addColorStop(0, 'rgba(144, 238, 144, 0.08)');
    shineGrad2.addColorStop(0.3, 'rgba(144, 238, 144, 0.04)');
    shineGrad2.addColorStop(1, 'rgba(144, 238, 144, 0)');
    ctx.fillStyle = shineGrad2;
    ctx.fillRect(0, 0, cW, cH);
    
    // === VISIBLE DESIGNS ===
    ctx.strokeStyle = 'rgba(0, 60, 0, 0.25)';
    ctx.lineWidth = 1.5;
    
    // 1. Concentric circles
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(180, 385, 70 + i * 25, 0, Math.PI * 2);  // Y+25
        ctx.stroke();
    }
    
    // 2. Diagonal cross-hatch
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < 10; i++) {
        const offset = i * 25;
        ctx.beginPath();
        ctx.moveTo(70 + offset, 235);  // Y+25
        ctx.lineTo(70, 235 + offset);   // Y+25
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(290 - offset, 235);  // Y+25
        ctx.lineTo(290, 235 + offset);   // Y+25
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
    
    // 3. Corner ornaments
    const corners = [[80, 245], [280, 245], [80, 515], [280, 515]];  // Y+25
    corners.forEach(([x, y]) => {
        ctx.strokeStyle = 'rgba(0, 60, 0, 0.2)';
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(x, y, 8 + i * 7, 0, Math.PI * 2);
            ctx.stroke();
        }
        // Cross inside
        ctx.strokeStyle = 'rgba(0, 60, 0, 0.15)';
        ctx.lineWidth = 1;
        const size = 6;
        ctx.beginPath();
        ctx.moveTo(x - size, y);
        ctx.lineTo(x + size, y);
        ctx.moveTo(x, y - size);
        ctx.lineTo(x, y + size);
        ctx.stroke();
    });
    
    // 4. Wave lines
    ctx.strokeStyle = 'rgba(0, 60, 0, 0.15)';
    ctx.lineWidth = 1.5;
    for (let row = 0; row < 3; row++) {
        ctx.beginPath();
        const yBase = 465 + row * 35;  // Y+25
        for (let x = 75; x < 290; x += 5) {
            const y = yBase + Math.sin(x * 0.06 + row * 1.5) * 10;
            row === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
    
    // 5. Tribal dots
    const dotPositions = [
        [85, 250], [95, 240], [105, 250],  // Y+25
        [255, 250], [265, 240], [275, 250], // Y+25
        [85, 510], [95, 520], [105, 510],   // Y+25
        [255, 510], [265, 520], [275, 510], // Y+25
        [85, 385], [95, 375], [105, 385],   // Y+25
        [255, 385], [265, 375], [275, 385]  // Y+25
    ];
    dotPositions.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 60, 0, 0.25)';
        ctx.fill();
    });
    
    // 6. Spiral
    ctx.strokeStyle = 'rgba(0, 60, 0, 0.2)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 12; i++) {
        const angle = i * 0.5;
        const radius = 5 + i * 2.5;
        const x = 255 + Math.cos(angle) * radius;
        const y = 520 + Math.sin(angle) * radius;  // Y+25
        if (i === 0) {
            ctx.beginPath();
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }
    ctx.stroke();
    
    // 7. Decorative crosses
    const crossPositions = [
        [100, 305], [150, 335], [210, 305], [260, 335],  // Y+25
        [100, 425], [150, 455], [210, 425], [260, 455]    // Y+25
    ];
    crossPositions.forEach(([x, y]) => {
        ctx.strokeStyle = 'rgba(0, 60, 0, 0.15)';
        ctx.lineWidth = 1.5;
        const size = 5;
        ctx.beginPath();
        ctx.moveTo(x - size, y);
        ctx.lineTo(x + size, y);
        ctx.moveTo(x, y - size);
        ctx.lineTo(x, y + size);
        ctx.stroke();
    });
    
    // 8. Diamond patterns
    ctx.strokeStyle = 'rgba(0, 60, 0, 0.2)';
    ctx.lineWidth = 1.5;
    const diamondPositions = [
        [110, 265], [150, 355], [210, 265], [250, 355]  // Y+25
    ];
    diamondPositions.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.moveTo(x, y - 10);
        ctx.lineTo(x + 10, y);
        ctx.lineTo(x, y + 10);
        ctx.lineTo(x - 10, y);
        ctx.closePath();
        ctx.stroke();
    });
    
    ctx.restore();
}

//array of answer objects

function getCellPosition(col, row, config) {
    const { startX, startY, increX, increY } = config;
    return {
        x: startX + (col - 2) * increX,
        y: startY + row * increY
    };
}

function getCellColor(row, col) {
    if (row === 1 || row === 7) {
        if (col >= 1 && col <= 3) return 'white';
    }
    if (row === 2 || row === 6) {
        if (col === 0 || col === 4) return 'yellow';
        if (col === 2) return 'white';
    }
    if (row >= 3 && row <= 5) {
        if (col === 2) return 'yellow';
    }
    return 'green';
}

function getSide(row, side) {
    // side = 0 means Red is human (plays from bottom)
    // side = 1 means Blue is human (plays from bottom)
    
    if (side === 0) {
        // Blue is human → Blue's white section at BOTTOM
        if (row <= 3) return 'red';    // Computer (Red) at top
        if (row === 4) return 'centre';
        return 'blue';                 // Human (Blue) at bottom
    } else {
        // Red is human → Red's white section at BOTTOM
        if (row <= 3) return 'blue';   // Computer (Blue) at top
        if (row === 4) return 'centre';
        return 'red';                  // Human (Red) at bottom
    }
}

function mirrorNumbers(numbers, config) {
    const { rows, cols } = config;
    const mirrored = [];
    for (let row = rows - 1; row >= 0; row--) {
        const start = row * cols;
        const end = start + cols;
        const rowVals = numbers.slice(start, end);
        mirrored.push(...rowVals.reverse());
    }
    return mirrored;
}

function getInitialButtonPositions() {
    const config = ANSWER_GRID;
    const { startX, startY, increX, increY } = config;
    
    // Button positions following the pass() pattern
    // Top buttons (rows 2,3,4 in 1-indexed)
    // Bottom buttons (rows 8,7,6 in 1-indexed)
    // Using cell + (3, 3) offset
    
    return {
        // Bottom buttons (index 0-3)
        0: { // Row 8, Col 2 (bottom center)
            x: startX + 0 * increX + 3,
            y: startY + 7 * increY + 3
        },
        1: { // Row 7, Col 3 (bottom right)
            x: startX + 1 * increX + 3,
            y: startY + 6 * increY + 3
        },
        2: { // Row 7, Col 1 (bottom left)
            x: startX - 1 * increX + 3,
            y: startY + 6 * increY + 3
        },
        3: { // Row 6, Col 2 (bottom middle)
            x: startX + 0 * increX + 3,
            y: startY + 5 * increY + 3
        },
        // Top buttons (index 4-7)
        4: { // Row 2, Col 2 (top center)
            x: startX + 0 * increX + 3,
            y: startY + 1 * increY + 3
        },
        5: { // Row 3, Col 1 (top left)
            x: startX - 1 * increX + 3,
            y: startY + 2 * increY + 3
        },
        6: { // Row 3, Col 3 (top right)
            x: startX + 1 * increX + 3,
            y: startY + 2 * increY + 3
        },
        7: { // Row 4, Col 2 (top middle)
            x: startX + 0 * increX + 3,
            y: startY + 3 * increY + 3
        }
    };
}

function mirrorButtonDefs(defs, config) {
    const { rows, cols } = config;
    return defs.map(({ id, row, col, isPlayer, tag }) => ({
        id: id,
        row: rows - row + 1,
        col: cols - 1 - col,
        isPlayer: isPlayer,
        tag: tag
    }));
}

function isOccupied(row, col, defs) {
    return defs.some(d => d.row === row - 1 && d.col === col);
}

function buildAnswerArray(side) {
    const config = ANSWER_GRID;
    const { cols, rows, cellW, cellH } = config;

    const topColor = side === 0 ? 'red' : 'blue';
    const bottomColor = side === 0 ? 'blue' : 'red';

    const goals = [
        {
            id: "1",
            x: config.startX,
            y: config.startY,
            w: cellW,
            h: cellH,
            col: topColor,
            side: topColor,
            occupancy: "no"
        }
    ];

    const numbers = side === 0 ? NUMBERS_SIDE0 : mirrorNumbers(NUMBERS_SIDE0, config);
    const defs = BUTTON_DEFS;

    const cells = [];
    let idx = 0;

    for (let row = 1; row <= rows; row++) {
        for (let col = 0; col < cols; col++) {
            const id = numbers[idx];
            idx++;
            const pos = getCellPosition(col, row, config);
            const color = getCellColor(row, col);
            // ✅ Pass 'side' to getSide
            const sideVal = getSide(row, side);
            const occ = isOccupied(row, col, defs) ? 'yes' : 'no';

            cells.push({
                id: id,
                x: pos.x,
                y: pos.y,
                w: cellW,
                h: cellH,
                col: color,
                side: sideVal,
                occupancy: occ
            });
        }
    }

    goals.push({
        id: "1",
        x: config.startX,
        y: config.startY + 8 * config.increY,
        w: cellW,
        h: cellH,
        col: bottomColor,
        side: bottomColor,
        occupancy: "no"
    });

    return [goals[0], ...cells, goals[1]];
}

function buildButtonArray(side) {
    const config = BUTTON_GRID;
    const { buttonW, buttonH } = config;
    const defs = BUTTON_DEFS;
    const initialPositions = getInitialButtonPositions();

    const buttons = [];

    defs.forEach((def, index) => {
        const pos = initialPositions[index];

        const col = (side === 0)
            ? (def.isPlayer ? 'red' : 'blue')
            : (def.isPlayer ? 'blue' : 'red');

        buttons.push({
            id: def.id,
            x: pos.x,
            y: pos.y,
            w: buttonW,
            h: buttonH,
            col: col,
            tag: def.tag
        });
    });

    return buttons;
}

function startSparkleBorder() {
    sparkleBorderActive = true;
    
    // Shuffle colors array
    for (let i = sparkleColors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [sparkleColors[i], sparkleColors[j]] = [sparkleColors[j], sparkleColors[i]];
    }
    
    sparkleColorIndex = 0;
    sparkleLastUpdate = Date.now();
}

function drawSparkleBorder() {
    if (!sparkleBorderActive) return;
    
    const config = ANSWER_GRID;
    const { startX, startY, increX, increY } = config;
    
    const currentTime = Date.now();
    if (currentTime - sparkleLastUpdate < sparkleInterval) return;
    
    sparkleLastUpdate = currentTime;
    sparkleColorIndex = (sparkleColorIndex + 1) % sparkleColors.length;
    const color = sparkleColors[sparkleColorIndex];
    
    // Main board - 7 rows × 5 columns
    // Board spans from col 0 to col 4, row 1 to row 7 (1-indexed)
    // Using cell positions: col 0 = startX - 2*increX, col 4 = startX + 2*increX
    // Row 1 = startY + 1*increY, Row 7 = startY + 7*increY
    const x = startX - 2 * increX;  // Left edge (col 0)
    const y = startY + 1 * increY;   // Top edge (row 1)
    const w = 5 * increX;            // 5 columns wide
    const h = 7 * increY;            // 7 rows high
    
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
    
    // Top goal (row 0, center)
    const topX = startX;
    const topY = startY;
    const topW = increX;
    const topH = increY;
    
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.strokeRect(topX, topY, topW, topH);
    ctx.restore();
    
    // Bottom goal (row 8, center)
    const botX = startX;
    const botY = startY + 8 * increY;
    const botW = increX;
    const botH = increY;
    
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.strokeRect(botX, botY, botW, botH);
    ctx.restore();
}

function renderButtons() {
    buttons = side == 1 ? button0 : button1;
    
    buttons.forEach((circles) => {
        const cx = circles.x + 22.5;
        const cy = circles.y + 22.5;
        const r = 18;
        const colors = getButtonColors(circles.col);
        
        ctx.save();
        
        // MAIN BUTTON WITH 3D GRADIENT (EXACT renderLevels pattern)
        const bodyGrad = ctx.createRadialGradient(cx - 4, cy - 6, 2, cx, cy, r + 1);
        bodyGrad.addColorStop(0.2, colors.lightColor);
        bodyGrad.addColorStop(0.5, circles.col);  // ← Uses color name at 0.5
        bodyGrad.addColorStop(0.8, colors.darkColor);
        
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.fillStyle = bodyGrad;
        ctx.fill();
        
        
        // Grey arc
        ctx.beginPath();
        ctx.arc(cx, cy, 12, Math.PI / 2, Math.PI * 5 / 4);
        ctx.strokeStyle = 'grey';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Specular highlight
        const highlightGrad = ctx.createRadialGradient(cx - 6, cy - 8, 1, cx - 3, cy - 5, r * 0.5);
        highlightGrad.addColorStop(0, 'rgba(255,255,255,0.5)');
        highlightGrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.fillStyle = highlightGrad;
        ctx.fill();
        
        // Outline
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'black';

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.restore();
drawButtonTag(circles);

}

let speechQueue = [];
let isSpeaking = false;
let currentUtterance = null;
    // ===========================================
// SPEECH TOGGLE
// ===========================================

function speakText(text, lang = 'en-US') {
    if (!speechEnabled) return;
    if (!('speechSynthesis' in window)) return;   // Intel 06 guard    
    speechQueue.push({ text, lang });
    if (!isSpeaking) {
        processSpeechQueue();
    }
}

function processSpeechQueue() {
    if (speechQueue.length === 0) {
        isSpeaking = false;
        currentUtterance = null;
        return;
    }
    
    isSpeaking = true;
    const item = speechQueue.shift();
    
    if ('speechSynthesis' in window) {
        currentUtterance = new SpeechSynthesisUtterance(item.text);
        currentUtterance.lang = item.lang;
        currentUtterance.rate = 0.9;
        currentUtterance.pitch = 1.0;
        currentUtterance.volume = 1.0;
        
        currentUtterance.onend = function() {
            currentUtterance = null;
            processSpeechQueue();
        };
        
        currentUtterance.onerror = function() {
            currentUtterance = null;
            processSpeechQueue();
        };
        
        window.speechSynthesis.speak(currentUtterance);
    } else {
        processSpeechQueue();
    }
}

function cancelAllSpeech() {
if(n>26) return;
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
    speechQueue = [];
    isSpeaking = false;
    currentUtterance = null;
}

function isSpeakingActive() {
    return isSpeaking || speechQueue.length > 0;
}

        if (gamePaused) {

        if (!calcAnimationActive) return;
        
        if (timestamp - lastCalcFrameTime < calcFrameDelay) {
            calcAnimationFrameId = requestAnimationFrame(animate);

        }
        lastCalcFrameTime = timestamp;
        
        if (pulseAnimationActive) {
            calcAnimationFrameId = requestAnimationFrame(animate);

        // Slowest animation step must be ≥ 1 frame.
const stepRate = 0.04 * Math.max(0.5, Math.min(3, gameSpeedMultiplier));
calcAnimationProgress += stepRate;

        if (calcAnimationProgress >= 1) {
            // ✅ Reset flags ONLY on completion
            animationInProgress = false;
            touchEnabled = true;
            explosionSoundPlayed = false;
            calcAnimationActive = false;

    startRestZone();
}

          return;
        }
        
        // ===========================================
        // 1. SCALE CALCULATION (ORIGINAL)
        // ===========================================
        let scale;
        if (calcAnimationProgress < 0.4) {
            scale = 0.5 + (calcAnimationProgress / 0.4) * 2.0;
        } else if (calcAnimationProgress < 0.7) {
            scale = 1;
        } else {
            // ✅ EXPLOSION TRIGGER (Synced at 0.7)

            }
            // Shrink from 10 down to 0 as progress goes from 0.7 to 1.0
            const explodeProgress = (calcAnimationProgress - 0.7) / 0.3;
            scale = 1 * (1 - explodeProgress);
        }
        
        // ===========================================
        // 2. POSITION CALCULATION (MOVE DURING GROW)
        // ===========================================
        let currentX = startX;
        let currentY = startY;
        
        if (calcAnimationProgress < 0.4) {
            const moveProgress = calcAnimationProgress / 0.4;
            const eased = moveProgress < 0.5 
                ? 2 * moveProgress * moveProgress 
                : 1 - Math.pow(-2 * moveProgress + 2, 2) / 2;
            currentX = startX + (endX - startX) * eased;
            currentY = startY + (endY + startY) / eased;
        } else {
            currentX = endX;
            currentY = endY;
        }
        
        // ===========================================
        // 3. RENDER
        // ===========================================
        if (!pulseAnimationActive) {

            return;

        const textColor = calcAnimationTeamColor === 'red' ? '#FF4444' : '#4444FF';
        
        ctx.save();
        ctx.translate(currentX, currentY);
        ctx.scale(scale, scale);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        ctx.shadowColor = textColor;
        ctx.shadowBlur = 15;
        
        // ✅ RESTORED ORIGINAL FONT SIZE (Fixed division by scale bug)

            let chanceFontSize = 50;
            
            if (calcAnimationChanceText === "FULL CHANCE!") chanceFontSize = 40;
            else if (calcAnimationChanceText === "HALF CHANCE!") chanceFontSize = 40;
            else if (calcAnimationChanceText === "BLOCKED!") chanceFontSize = 40;
            else if (calcAnimationChanceText === "GOAL!") chanceFontSize = 50;
            
            ctx.globalAlpha = flashOpacity;
            ctx.fillStyle = calcAnimationTeamColor === 'red' ? '#FF8888' : '#8888FF';
            ctx.font = `bold ${chanceFontSize}px fantasy, papyrus`;
            ctx.fillText(calcAnimationChanceText, 0, chanceYOffset);
            ctx.globalAlpha = 1;
            
            if (calcAnimationChanceText === "GOAL!") {
                const sparkleCount = 16;
                const sparkleScale = 1 / scale; // Keeps sparkles proportional to screen
                for (let i = 0; i < sparkleCount; i++) {
                    const angle = (i / sparkleCount) * Math.PI * 2 + (explodeProgress * Math.PI * 8);
                    const distance = 100 * explodeProgress;
                    const x = Math.cos(angle) * distance * sparkleScale;
                    const y = Math.sin(angle) * distance * sparkleScale;
                    const sparkleSize = 8 * (1 - explodeProgress) * sparkleScale;
                    ctx.fillStyle = calcAnimationTeamColor === 'red' ? '#FF8888' : '#8888FF';
                    ctx.globalAlpha = 1 - explodeProgress;
                    ctx.beginPath();
                    ctx.arc(x, y, sparkleSize, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        }
        
        // ===========================================
        // 5. PARTICLES (STARTS AT 0.7)
        // ===========================================
        if (calcAnimationProgress > 0.7) {
            const explodeProgress = (calcAnimationProgress - 0.7) / 0.3;
            const particleCount = (calcAnimationChanceText === "GOAL!") ? 36 : 24;
            const particleColor = calcAnimationTeamColor === 'red' ? '#FF6666' : '#6666FF';
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2;
                const distance = 150 * explodeProgress;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                const particleSize = (calcAnimationChanceText === "GOAL!" ? 8 : 6) * (1 - explodeProgress);
                
                ctx.fillStyle = particleColor;
                ctx.globalAlpha = 1 - explodeProgress;
                ctx.beginPath();
                ctx.arc(x, y, particleSize, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        
        ctx.restore();
        
        calcAnimationFrameId = requestAnimationFrame(animate);
    }

    if (lastMoveData && calcAnimationChanceText === "GOAL!") {

function startPulsatingFrame(targetCell, teamColor) {
    // Cancel calculation animation if running
    if (calcAnimationFrameId) {
        cancelAnimationFrame(calcAnimationFrameId);
        calcAnimationActive = false;
        calcAnimationFrameId = null;
    }
    animationInProgress = true;
    touchEnabled = false;

    if (pulseFrameId) {
        cancelAnimationFrame(pulseFrameId);
        pulseFrameId = null;
    }
    
    pulseAnimationActive = true;
    pulseStartTime = performance.now();
    
    // ✅ Capture coordinates at start — cell object is stable, but be explicit
    const goalX = targetCell.x + targetCell.w / 2;
    const goalY = targetCell.y + targetCell.h / 2;
    const cellX = targetCell.x;
    const cellY = targetCell.y;
    const cellW = targetCell.w;
    const cellH = targetCell.h;

    let pausedPulseAccum = 0;
    let pauseStartedAt = 0;

    function animatePulse(timestamp) {
        // Pause handling
        if (gamePaused) {
            if (!pauseStartedAt) pauseStartedAt = timestamp;
            pulseFrameId = requestAnimationFrame(animatePulse);
            return;
        }
        if (pauseStartedAt) {
            pausedPulseAccum += timestamp - pauseStartedAt;
            pauseStartedAt = 0;
        }

        if (!pulseAnimationActive) return;
        
        if (timestamp - lastPulseFrameTime < pulseFrameDelay) {
            pulseFrameId = requestAnimationFrame(animatePulse);
            return;
        }
        lastPulseFrameTime = timestamp;
        
        // ✅ Speed-aware: reads gameSpeedMultiplier live
        // Pulse runs natural — same duration at every speed.
const effectiveElapsed = timestamp - pulseStartTime - pausedPulseAccum;
const progress = Math.min(effectiveElapsed / BASE_PULSE_DURATION, 1);

        ctx.save();
        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.restore();

        renderAnswer();
        renderButtons();
        renderStats();
        statDraw(va, vb, vc, vd, ve, vf, vg, vh);
        
        if (selectedButton) {
            highlightButtonAndNumbers(selectedButton, selectedButtonLinks);
        }
        
        // PHASE 1: PULSATING FRAME
        if (progress < 0.5) {
            const frameProgress = progress / 0.5;
            const pulseIntensity = 0.3 + 0.7 * Math.abs(Math.sin(frameProgress * Math.PI * 6));
            
            ctx.save();
            ctx.strokeStyle = teamColor === 'red' ? '#FF0000' : '#0000FF';
            ctx.lineWidth = 4 + (12 * pulseIntensity);
            ctx.globalAlpha = 0.5 * pulseIntensity;
            ctx.strokeRect(cellX - 6, cellY - 6, cellW + 12, cellH + 12);
            
            ctx.strokeStyle = teamColor === 'red' ? '#FF4444' : '#4444FF';
            ctx.lineWidth = 6;
            ctx.globalAlpha = 0.9;
            ctx.strokeRect(cellX - 2, cellY - 2, cellW + 4, cellH + 4);
            
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 1;
            ctx.strokeRect(cellX, cellY, cellW, cellH);
            ctx.restore();
        }
        
        // PHASE 2: EXPLOSION
        if (progress >= 0.5) {
            const explodeProgress = (progress - 0.5) / 0.5;
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2 + (explodeProgress * Math.PI * 4);
                const distance = 80 * explodeProgress;
                const x = goalX + Math.cos(angle) * distance;
                const y = goalY + Math.sin(angle) * distance;
                const particleSize = 8 * (1 - explodeProgress);
                
                ctx.save();
                ctx.fillStyle = teamColor === 'red' ? '#FF6666' : '#6666FF';
                ctx.globalAlpha = 1 - explodeProgress;
                ctx.beginPath();
                ctx.arc(x, y, particleSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            let scoreScale, scoreOpacity;
            if (explodeProgress < 0.6) {
                scoreScale = 0.5 + explodeProgress * 1.5;
                scoreOpacity = explodeProgress * 1.5;
            } else {
                const fadeProgress = (explodeProgress - 0.6) / 0.4;
                scoreScale = 1.4 * (1 - fadeProgress * 0.3);
                scoreOpacity = 1 - fadeProgress;
            }
            
            ctx.save();
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 5;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const scoreX = goalX;
            const scoreY = goalY - 15;
            const fontSize = 56 * scoreScale;
            
            if (fontSize >= 24) {
                ctx.font = `bold ${Math.floor(fontSize)}px fantasy, papyrus`;
                ctx.globalAlpha = scoreOpacity;
                ctx.fillStyle = '#FF0000';
                ctx.fillText(redGoal.toString(), scoreX - 25, scoreY);
                ctx.fillStyle = 'white';
                ctx.fillText(":", scoreX, scoreY);
                ctx.fillStyle = '#0000FF';
                ctx.fillText(blueGoal.toString(), scoreX + 25, scoreY);
            }
            ctx.restore();
        }
        
        if (progress >= 1) {
    pulseAnimationActive = false;
    pulseFrameId = null;
    animationInProgress = false;
    touchEnabled = true;
    
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

    renderAnswer();

function frameGoalMouths() {

        const { button, targetCell, sourceCell, chanceType, points, moveTeam, nextTeam } = lastMoveData;

    const topDefender = (side === 0) ? 'blue' : 'red';
    const bottomDefender = (side === 0) ? 'red' : 'blue';
    
    let topThreateningButton = null;
    let bottomThreateningButton = null;
    let topThreatened = false;
    let bottomThreatened = false;
    
    // Check top goal
    const topGoalDir = categorizeButtonsByDirection(topGoal);
    for (let dir of allDirs) {
        const closestButton = topGoalDir && topGoalDir[dir] && topGoalDir[dir][0];
        if (closestButton && closestButton.col !== 'centre' && closestButton.col !== topDefender && topGoal.occupancy === 'no') {
            topThreatened = true;
            topThreateningButton = closestButton;
            break;
        }
    }
    
    // Check bottom goal
    const bottomGoalDir = categorizeButtonsByDirection(bottomGoal);
    for (let dir of allDirs) {
        const closestButton = bottomGoalDir && bottomGoalDir[dir] && bottomGoalDir[dir][0];
        if (closestButton && closestButton.col !== 'centre' && closestButton.col !== bottomDefender && bottomGoal.occupancy === 'no') {
            bottomThreatened = true;
            bottomThreateningButton = closestButton;
            break;
        }
    }
    
    const currentTime = Date.now();
    
    // Blink logic
    if (topThreatened !== lastTopThreatened || bottomThreatened !== lastBottomThreatened) {
        goalBlinkStartTime = currentTime;
        goalBlinkActive = true;
        lastTopThreatened = topThreatened;
        lastBottomThreatened = bottomThreatened;
    }
    
    if (goalBlinkActive && (currentTime - goalBlinkStartTime) >= 1000) {
        goalBlinkActive = false;
    }
    
    let blinkOpacity = 1;
    if (goalBlinkActive) {
        const elapsed = currentTime - goalBlinkStartTime;
        const blinkPhase = Math.floor(elapsed / 100) % 2;
        blinkOpacity = blinkPhase === 0 ? 1 : 0.3;
    }
    
    // === DRAW TOP GOAL FRAME + CIRCLE ===
    if (topThreatened && topThreateningButton) {
        const color = (topThreateningButton.col === 'red') ? '#FF0000' : '#0000FF';
        const fillColor = (topThreateningButton.col === 'red') ? 'rgba(255, 0, 0, 0.15)' : 'rgba(0, 0, 255, 0.15)';
        const cx = topGoal.x + topGoal.w / 2;
        const cy = topGoal.y + topGoal.h / 2;
        const radius = Math.min(topGoal.w, topGoal.h) / 2 - 6;
        
        ctx.save();
        
        // === OUTER FRAME ===
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.globalAlpha = blinkOpacity;
        ctx.strokeRect(topGoal.x - 3, topGoal.y - 3, topGoal.w + 6, topGoal.h + 6);
        
        // === INNER PULSE FILL ===
        const pulse = 0.3 + 0.2 * Math.sin(currentTime / 500);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = fillColor;
        ctx.fillRect(topGoal.x - 2, topGoal.y - 2, topGoal.w + 4, topGoal.h + 4);
        
        // === CIRCLE INSIDE THE GOAL ===
        ctx.globalAlpha = blinkOpacity;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
        
        // === CIRCLE PULSE GLOW ===
        const circlePulse = 0.2 + 0.15 * Math.sin(currentTime / 400);
        ctx.globalAlpha = circlePulse;
        ctx.fillStyle = fillColor;
        ctx.beginPath();
        ctx.arc(cx, cy, radius - 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    }
    
    // === DRAW BOTTOM GOAL FRAME + CIRCLE ===
    if (bottomThreatened && bottomThreateningButton) {
        const color = (bottomThreateningButton.col === 'red') ? '#FF0000' : '#0000FF';
        const fillColor = (bottomThreateningButton.col === 'red') ? 'rgba(255, 0, 0, 0.15)' : 'rgba(0, 0, 255, 0.15)';
        const cx = bottomGoal.x + bottomGoal.w / 2;
        const cy = bottomGoal.y + bottomGoal.h / 2;
        const radius = Math.min(bottomGoal.w, bottomGoal.h) / 2 - 6;
        
        ctx.save();
        
        // === OUTER FRAME ===
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.globalAlpha = blinkOpacity;
        ctx.strokeRect(bottomGoal.x - 3, bottomGoal.y - 3, bottomGoal.w + 6, bottomGoal.h + 6);
        
        // === INNER PULSE FILL ===
        const pulse = 0.3 + 0.2 * Math.sin(currentTime / 500);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = fillColor;
        ctx.fillRect(bottomGoal.x - 2, bottomGoal.y - 2, bottomGoal.w + 4, bottomGoal.h + 4);
        
        // === CIRCLE INSIDE THE GOAL ===
        ctx.globalAlpha = blinkOpacity;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
        
        // === CIRCLE PULSE GLOW ===
        const circlePulse = 0.2 + 0.15 * Math.sin(currentTime / 400);
        ctx.globalAlpha = circlePulse;
        ctx.fillStyle = fillColor;
        ctx.beginPath();
        ctx.arc(cx, cy, radius - 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
}

        if (g === 15) {

                goalColor = bottomGoalColor;
            }
        }
        
        if (!goal || !goalColor) continue;
        
        // === CALCULATE DIRECTION FROM CELL TO GOAL ===
        const dx = goal.x - pos.x;
        const dy = goal.y - pos.y;
        
        let goalDirection = '';
        if (dx === 0 && dy < 0) goalDirection = 'up';
        else if (dx === 0 && dy > 0) goalDirection = 'down';
        else if (dy === 0 && dx < 0) goalDirection = 'left';
        else if (dy === 0 && dx > 0) goalDirection = 'right';
        else if (dx > 0 && dy > 0) goalDirection = 'down-right';
        else if (dx < 0 && dy > 0) goalDirection = 'down-left';
        else if (dx > 0 && dy < 0) goalDirection = 'up-right';
        else if (dx < 0 && dy < 0) goalDirection = 'up-left';
        
      // === CHECK GOAL DIRECTION ===
const cellDir = categorizeButtonsByDirection(pos);

    const firstButton = buttonsInGoalDir[0];
    if (firstButton.col === goalColor) {
        isBlocked = true; // Defender blocking
    }
}

if (isBlocked) continue;

// Step 2: If no button in goal direction → check other directions for opponent
let hasThreat = false;
let threateningButton = null;

for (let dir of allDirs) {
    if (dir === goalDirection) continue; // Skip goal direction
    const btn = cellDir && cellDir[dir] && cellDir[dir][0];
    if (btn && btn.col !== goalColor) {
        hasThreat = true;
        threateningButton = btn;
        break;
    }
}

if (hasThreat && threateningButton) {
    threatenedPositions.push({
        position: pos,
        color: threateningButton.col,
        id: pos.id
    });
}
    
    // === BLINK LOGIC ===
    let stateChanged = false;
    const currentIds = threatenedPositions.map(t => t.id).sort().join(',');
    const lastIds = lastDirectLinkThreats.map(t => t.id).sort().join(',');
    
    if (currentIds !== lastIds) {
        stateChanged = true;
    }
    
    if (stateChanged) {
        directLinkBlinkStartTime = currentTime;
        directLinkBlinkActive = true;
        lastDirectLinkThreats = threatenedPositions;
    }
    
    if (directLinkBlinkActive && (currentTime - directLinkBlinkStartTime) >= 1000) {
        directLinkBlinkActive = false;
    }
    
    let blinkOpacity = 1;
    if (directLinkBlinkActive) {
        const elapsed = currentTime - directLinkBlinkStartTime;
        const blinkPhase = Math.floor(elapsed / 100) % 2;
        blinkOpacity = blinkPhase === 0 ? 1 : 0.3;
    }
    
    // === DRAW CIRCLES ===
    threatenedPositions.forEach((threat) => {
        const pos = threat.position;
        const centerX = pos.x + pos.w / 2;
        const centerY = pos.y + pos.h / 2;
        const radius = Math.min(pos.w, pos.h) / 2 - 6;

        ctx.globalAlpha = blinkOpacity;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.stroke();
        
        const pulse = 0.3 + 0.2 * Math.sin(currentTime / 500);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = fillColor;
        ctx.beginPath();

        ctx.fill();
        
        ctx.restore();
